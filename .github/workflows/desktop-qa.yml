name: Desktop QA

# The desktop app's QA: every registered screen (app/desktop/qa/registry.ts) x fixture, at three window sizes in light
# and dark, with the DOM checks failing the job on any finding (overflow without wrap/ellipsis, overlapping text or
# rows, content within 8 px of the window edge, raw ids/hashes/keys/markdown outside code). Linux runs it at scale 1;
# macOS runs it at scale 2 with the platform bits (traffic lights, menu, fonts, a shot of the real window).
# The contact sheet (index.html), the PNGs with their annotated overlays and findings.json are the run's artifacts.
#
# The screens are sharded across jobs (Playwright's --shard; every test is its own unit), 4 on Linux and 3 on macOS.
# Each shard has its own contact sheet, artifact desktop-qa-<os>-<shard>.
#
# No pull request or push runs it. It ran on every PR that touched app/desktop until Nov 2026 and took 4.3 minutes
# (median; 5.3 max) as 4 shards: ~500 tests, one Electron launch each, ~2,500 test-seconds, ~30 s of setup per job. A
# PR keeps it only under a minute, which would take ~35 shards per run, and running only the screens a change shows
# doesn't help, since most desktop PRs touch ui/ or shared CSS, which every screen shows. Before a push,
# scripts/check.sh runs the screens a renderer change shows (app/desktop/qa/touched.ts), and `scripts/check.sh qa` runs
# them all. On a branch, `gh workflow run desktop-qa.yml --ref <branch>` runs the Linux shards here; mac.yml calls it
# with `macos` nightly, on demand and before each release, and its report opens an issue when a shard fails.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      macos:
        description: The macOS shards (scale 2, with the platform bits) instead of Linux's
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  qa:
    strategy:
      fail-fast: false
      # Linux's 4 shards, or macOS's 3 when mac.yml calls this workflow.
      matrix:
        include: >-
          ${{ fromJSON(inputs.macos
          && '[{"os":"macos-latest","scale":2,"shard":1,"of":3},{"os":"macos-latest","scale":2,"shard":2,"of":3},
          {"os":"macos-latest","scale":2,"shard":3,"of":3}]'
          || '[{"os":"ubuntu-latest","scale":1,"shard":1,"of":4},{"os":"ubuntu-latest","scale":1,"shard":2,"of":4},
          {"os":"ubuntu-latest","scale":1,"shard":3,"of":4},{"os":"ubuntu-latest","scale":1,"shard":4,"of":4}]') }}
    name: qa (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/desktop
    env:
      QA_SCALE: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - uses: ./.github/actions/electron-cache
      - run: pnpm install --frozen-lockfile
      # Electron fetches its binary on first launch; fetch it here so the first test isn't timed on a download.
      - run: ../../.github/actions/electron-cache/retry.sh pnpm exec install-electron
      # The fixtures are cached under a hash of every file their build reads (scripts/fixtures-key.ts follows the part
      # of the app they import), so a shard whose fixtures a run has built before skips that minute. The QA build takes
      # seconds and isn't cached.
      - id: fixtures-key
        run: echo "key=$(node scripts/fixtures-key.ts)" >> "$GITHUB_OUTPUT"
      - id: fixtures
        uses: actions/cache@v5
        with:
          path: app/desktop/fixtures/*.json
          key: fixtures-${{ runner.os }}-${{ steps.fixtures-key.outputs.key }}
      - if: steps.fixtures.outputs.cache-hit != 'true'
        # Build output of app/desktop/fixtures, validated against the contracts' JSON Schemas.
        run: pnpm fixtures
      # The app with the QA error probe bundled, which release builds leave out.
      - run: pnpm qa:build
      - if: matrix.shard == 1
        name: Self-test of the DOM checks
        run: pnpm qa:selftest
      - name: Screens
        run: pnpm qa --shard=${{ matrix.shard }}/${{ matrix.of }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-qa-${{ runner.os }}-${{ matrix.shard }}
          path: |
            app/desktop/qa-results/
            app/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14
