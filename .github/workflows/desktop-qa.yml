name: Desktop QA

# The desktop app's QA gate: every registered screen (app/desktop/qa/registry.ts) x fixture, at three window sizes in
# light and dark, with the DOM checks failing the job on any finding (overflow without wrap/ellipsis, overlapping
# text or rows, content within 8 px of the window edge, raw ids/hashes/keys/markdown outside code). Linux runs it at
# scale 1; macOS runs it at scale 2 with the platform bits (traffic lights, menu, fonts, a shot of the real window).
# The contact sheet (index.html), the PNGs with their annotated overlays and findings.json are the run's artifact.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# As in ci.yml: a newer push to a PR cancels its run; runs on main and on the train's batch PR are never cancelled.
concurrency:
  group: >-
    ${{ (github.ref == 'refs/heads/main' || github.head_ref == 'fleetd/train/batch')
    && format('{0}-{1}', github.workflow, github.run_id)
    || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.head_ref != 'fleetd/train/batch' }}

permissions:
  contents: read

jobs:
  qa:
    strategy:
      fail-fast: false
      # The macOS leg runs only where ci.yml's macOS jobs do: main, the train's batch PR, workflow_dispatch and PRs
      # with the `macos` label. It isn't a required check, so on other PRs it is left out of the matrix.
      matrix:
        include: >-
          ${{ fromJSON((github.event_name != 'pull_request' || github.head_ref == 'fleetd/train/batch'
          || contains(github.event.pull_request.labels.*.name, 'macos'))
          && '[{"os":"ubuntu-latest","scale":1},{"os":"macos-latest","scale":2}]'
          || '[{"os":"ubuntu-latest","scale":1}]') }}
    name: qa (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/desktop
    env:
      QA_SCALE: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Scope
        # Runs when app/desktop or this workflow changed; otherwise reports success at once, so it can be required.
        id: scope
        working-directory: .
        run: |
          run=true
          if [ "${{ github.event_name }}" != workflow_dispatch ] && git rev-parse -q --verify HEAD^1 >/dev/null \
            && git diff --quiet HEAD^1 HEAD -- app/desktop .github/workflows/desktop-qa.yml; then
            run=false
            echo "app/desktop didn't change."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('app/desktop/pnpm-lock.yaml') }}
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.run == 'true'
        # Electron fetches its binary on first launch; fetch it here so the first test isn't timed on a download.
        run: pnpm exec install-electron
      - if: steps.scope.outputs.run == 'true'
        # Build output of app/desktop/fixtures, validated against the contracts' JSON Schemas.
        run: pnpm fixtures
      - if: steps.scope.outputs.run == 'true'
        # The app with the QA error probe bundled, which release builds leave out.
        run: pnpm qa:build
      - if: steps.scope.outputs.run == 'true'
        name: Self-test of the DOM checks
        run: pnpm qa:selftest
      - if: steps.scope.outputs.run == 'true'
        name: Screens
        run: pnpm qa
      - if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-qa-${{ runner.os }}
          path: |
            app/desktop/qa-results/
            app/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14
