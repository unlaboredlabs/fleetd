name: Mobile

# The phone app (app/mobile): its checks, an Android APK on Linux and an iOS simulator build on macOS. No EAS and no
# Expo service: `expo prebuild` makes the native projects, then gradle and xcodebuild build them. Signed builds are
# mobile-release.yml's, by hand; nothing here reads a secret. Pull requests and pushes run the Linux jobs only
# (ci.no-macos-on-prs): the iOS build runs on a manual run, and nightly and before each release when mac.yml calls this
# workflow with `ios`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      metro:
        description: >-
          A Metro server (host:port) the iOS simulator build loads its JavaScript from: a Debug build, for trying
          changes on a simulator with `expo start` on that host. Empty: the Release build, the JavaScript bundled in.
        required: false
        default: ""
  workflow_call:
    inputs:
      ios:
        description: The iOS build alone
        type: boolean
        default: false

# As ci.yml: a newer push to a PR cancels its running build; main, the merge train's batch and mac.yml's call each get a
# group.
concurrency:
  group: >-
    ${{ inputs.ios && format('{0}-{1}-ios', github.workflow, github.run_id)
    || (github.ref == 'refs/heads/main' || endsWith(github.head_ref || github.ref, 'train/batch'))
    && format('{0}-{1}', github.workflow, github.run_id)
    || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.ios && github.ref != 'refs/heads/main' && !endsWith(github.head_ref || github.ref, 'train/batch') }}

permissions:
  contents: read

jobs:
  mobile-scope:
    # Whether the app's checks and the Android build have work: each needs this job and is skipped (which passes,
    # required or not) when the paths didn't change: app/mobile, the desktop modules the app imports
    # (app/mobile/src/desktop.ts), and site/vercel.json, whose update route the checks test. A manual run builds
    # everything.
    name: mobile scope
    if: ${{ !inputs.ios }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: |
          # A manual run builds everything: it is how a fork gets its own builds (docs: fleetd.sh/docs/mobile).
          base=
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then base=$(git rev-parse -q --verify HEAD^1 || true); fi
          # scope <output> <check> <paths>: <output>=true when any of the paths, or this workflow, changed.
          scope() {
            out=$1
            check=$2
            shift 2
            run=true
            if [ -n "$base" ] && git diff --quiet "$base" HEAD -- "$@" .github/workflows/mobile.yml; then
              run=false
              echo "::notice::no work for $check"
            fi
            echo "$out=$run" | tee -a "$GITHUB_OUTPUT"
          }
          scope app "mobile" app/mobile app/desktop/src/shared app/desktop/src/renderer/src/data/chat.ts \
            app/desktop/src/renderer/src/data/chat-contract.ts app/desktop/src/renderer/screens/navi/model.ts \
            app/desktop/src/renderer/screens/updates/model.ts app/desktop/src/renderer/screens/updates/flow.ts \
            app/desktop/src/renderer/screens/projects/source.ts app/desktop/src/renderer/screens/projects/discovery.ts \
            app/desktop/src/renderer/screens/projects/flow.ts app/desktop/src/renderer/screens/projects/contracts.ts \
            app/desktop/src/renderer/screens/settings/profilesModel.ts app/desktop/src/renderer/screens/settings/projectModel.ts \
            site/vercel.json

  mobile:
    # Types (with the desktop modules the app imports) and the client's unit tests.
    name: mobile
    needs: mobile-scope
    if: ${{ !cancelled() && !inputs.ios && needs.mobile-scope.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  android:
    # A release APK, debug-signed (installable with adb or by opening it on the phone), for arm64 phones and x86_64
    # emulators.
    name: mobile (android)
    needs: mobile-scope
    if: ${{ !cancelled() && !inputs.ios && needs.mobile-scope.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Build
        working-directory: app/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: fleetd-android-apk
          path: app/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    # A Release build for the iOS simulator, its Notification Service and Share extensions embedded, signed to run
    # locally (no team: the keychain needs its entitlements even on a simulator), the JavaScript bundled in. A manual
    # run with a Metro address builds Debug instead, which loads the JavaScript from there. First, the notification
    # extension's crypto against the hub's sealed boxes, and the share extension's decisions. A manual run or mac.yml's
    # call only: a pull request's Linux jobs check the same JavaScript, typed, tested and bundled into the APK.
    name: mobile (ios)
    if: ${{ inputs.ios || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      METRO: ${{ inputs.metro }}
      CONFIGURATION: ${{ inputs.metro != '' && 'Debug' || 'Release' }}
    defaults:
      run:
        working-directory: app/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/mobile/package-lock.json
      - name: Extension crypto
        run: |
          swiftc -O plugins/notification-service/Sealed.swift plugins/notification-service/Payload.swift \
            plugins/notification-service/test/main.swift \
            -o "$RUNNER_TEMP/sealed-test"
          "$RUNNER_TEMP/sealed-test" src/push.fixture.json
      - name: Share extension
        run: |
          swiftc -O plugins/share-extension/Shared.swift plugins/share-extension/test/main.swift -o "$RUNNER_TEMP/share-test"
          "$RUNNER_TEMP/share-test"
      - run: npm ci --no-audit --no-fund
      # Installs the pods too.
      - run: npx expo prebuild --platform ios --clean
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -workspace ios/fleetd.xcworkspace -scheme fleetd -configuration "$CONFIGURATION" \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build | tail -n 200
          app=build/Build/Products/$CONFIGURATION-iphonesimulator/fleetd.app
          appex=$app/PlugIns/FleetdNotifications.appex
          test -x "$appex/FleetdNotifications" || { echo "::error::the app has no Notification Service Extension"; exit 1; }
          share=$app/PlugIns/FleetdShare.appex
          test -x "$share/FleetdShare" || { echo "::error::the app has no Share Extension"; exit 1; }
          # Signed to run locally, with its entitlements, which a simulator reads from the binary's __entitlements
          # section: without the keychain group, secure storage fails there, and the share extension finds no pairing.
          grep -aq keychain-access-groups "$app/fleetd" || { echo "::error::the app is built without its keychain group"; exit 1; }
          grep -aq keychain-access-groups "$share/FleetdShare" || { echo "::error::the share extension is built without its keychain group"; exit 1; }
          # Where a Debug build finds Metro (React Native's RCTBundleURLProvider reads it), sealed in by signing again.
          if [ -n "$METRO" ]; then
            printf '%s\n' "$METRO" > "$app/ip.txt"
            codesign --force --sign - --preserve-metadata=entitlements "$app"
          fi
      - name: App Transport Security
        # The built app's own Info.plist lets plain HTTP reach a hub at any address: arbitrary loads, nothing cancelling them.
        run: |
          plutil -convert json -o "$RUNNER_TEMP/Info.json" "build/Build/Products/$CONFIGURATION-iphonesimulator/fleetd.app/Info.plist"
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ats.ts "$RUNNER_TEMP/Info.json"
      - name: Pack
        run: ditto -c -k --keepParent "build/Build/Products/$CONFIGURATION-iphonesimulator/fleetd.app" "$RUNNER_TEMP/fleetd-ios-simulator.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: fleetd-ios-simulator
          path: ${{ runner.temp }}/fleetd-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
