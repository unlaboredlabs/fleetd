name: Stale label runs

# A push to a PR cancels the runs macos-label.yml dispatched for its last head, as it does the PR's own runs: those have
# a concurrency group of their own (ci.yml), so nothing else cancels them, and they would hold the scarce macOS runners
# for a head nobody merges. A failed cancel leaves a run going, never a red check on the new head.

on:
  pull_request:
    types: [synchronize]

permissions:
  actions: write

jobs:
  cancel:
    if: ${{ !endsWith(github.head_ref, 'train/batch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for workflow in ci.yml desktop-qa.yml; do
            gh run list --workflow "$workflow" --branch "$BRANCH" --event workflow_dispatch --json databaseId,headSha,status \
              -q ".[] | select(.status != \"completed\" and .headSha != \"$HEAD\") | .databaseId" |
              while read -r run; do gh run cancel "$run" || true; done
          done
