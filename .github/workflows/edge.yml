# Every commit on main whose CI passed updates the rolling `edge` prerelease (and `nightly`, its copy for builds from
# before the rename, D203): edge, and the hubs that update from it, only ever take a green main commit, never one whose
# CI failed or is still running. A build takes longer than merges come, so a newer green commit never cancels a running
# edge build: it waits, and a still newer one replaces it while it waits, so the newest builds next and the ones between
# are skipped. A re-run of an older commit's CI that passes builds it too, and publishes nothing over a newer one. The
# app change check compares with what the release carries, so nothing a skipped run would have shipped is lost, and the
# publish job skips a build when the release already holds a newer commit.
# Pull requests that change the release pipeline itself get a dry run on Linux (CLI and the app's Linux packages),
# publishing nothing. The mac app job runs only for a main push that changed the app, a tag, or a manual dispatch
# (from a branch: a dry run that publishes nothing).
name: Edge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/edge.yml
      - .github/workflows/build-release.yml
      - .github/release/**
      - .github/actions/electron-cache/**
      - app/desktop/electron-builder.yml
      - app/desktop/build/**
  workflow_dispatch:
    inputs:
      force-app:
        description: Rebuild the app even if app/ is unchanged
        type: boolean
        default: false

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'release-edge' || format('release-dry-run-{0}', github.ref) }}
  # Only pull request dry runs and dispatches from a branch cancel the run in progress.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}

jobs:
  edge:
    # CI's run on a push to main, and only once it passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: ./.github/workflows/build-release.yml
    with:
      channel: edge
      # Only main publishes. A dispatch from a branch is a dry run that also builds, signs and notarizes the mac app.
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      force-app: ${{ inputs.force-app == true }}
      # The commit CI passed on, not main's newest.
      sha: ${{ github.event.workflow_run.head_sha || '' }}
    permissions:
      contents: write
    secrets: inherit
