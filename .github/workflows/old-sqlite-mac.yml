# TEMPORARY (W775, T4683): which SQLite fleetd's hub uses on macOS, and whether it migrates from empty there.
# Removed before the PR is final.
name: old-sqlite-mac
on:
  push:
    branches: [fleetd/T4683-a-mac-hub-s-database-updates-on-every]
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: The system's SQLite and Bun's
        run: |
          sw_vers
          echo "system sqlite3 CLI: $(sqlite3 --version)"
          ls -l /usr/lib/libsqlite3.dylib || echo "(in the dyld shared cache, as every system dylib)"
          bun -e 'import {Database} from "bun:sqlite"; const d = new Database(":memory:"); console.log("bun:sqlite sqlite_version():", d.query("select sqlite_version() v").get().v); console.log("compile options:", d.query("pragma compile_options").all().map(r => r.compile_options).filter(o => /FTS|JSON|VERSION/.test(o)).join(" "))'
          echo "libraries Bun loads for bun:sqlite:"
          DYLD_PRINT_LIBRARIES=1 bun -e 'import {Database} from "bun:sqlite"; new Database(":memory:")' 2>&1 | grep -i sqlite || true
      - name: The released edge CLI (main at its build) starts a hub from empty
        run: |
          gh release view edge -R ${{ github.repository }} --json body -q .body | head -1
          gh release download edge -R ${{ github.repository }} -p fleetd-bun-darwin-arm64 -D "$RUNNER_TEMP/edge"
          bin="$RUNNER_TEMP/edge/fleetd-bun-darwin-arm64"
          chmod +x "$bin"
          export FLEETD_HOME="$RUNNER_TEMP/edge-home"
          "$bin" version
          "$bin" hub start --home "$FLEETD_HOME/hub" --listen 127.0.0.1:47911 > "$RUNNER_TEMP/edge-hub.log" 2>&1 &
          pid=$!
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:47911/healthz && break; kill -0 $pid 2>/dev/null || break; sleep 0.5; done
          echo; echo "--- hub output:"; cat "$RUNNER_TEMP/edge-hub.log"
          if kill -0 $pid 2>/dev/null; then echo "RESULT: the edge hub started"; kill $pid; else wait $pid; echo "RESULT: the edge hub exited $?"; fi
      - name: This branch's build starts a hub from empty (smoke)
        working-directory: fleetd
        run: |
          bun install --frozen-lockfile
          bun run compile
          bun run smoke
