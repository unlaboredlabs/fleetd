# Builds every release asset and publishes them. Called by nightly.yml (rolling `nightly` prerelease, every push to
# main) and release.yml (`v*` tags). Asset names carry no version, so
# releases/download/nightly/<name> and releases/latest/download/<name> stay stable for the installer and
# `fleetd update`.
name: Build release

on:
  workflow_call:
    inputs:
      channel:
        description: nightly or stable
        type: string
        required: true
      publish:
        description: false builds everything and publishes nothing (pull request dry runs)
        type: boolean
        default: true
      force-app:
        description: build the app even when app/ is unchanged since the last nightly
        type: boolean
        default: false
      desktop:
        description: also build the Electron app (app/desktop) and its update feed; off until it replaces fleetd-app
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      has-cli: ${{ steps.plan.outputs.has-cli }}
      build-app: ${{ steps.plan.outputs.build-app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          CHANNEL: ${{ inputs.channel }}
          PUBLISH: ${{ inputs.publish }}
          FORCE_APP: ${{ inputs.force-app }}
        run: |
          if [ "$CHANNEL" = stable ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
            base="${base#v}"
            # Valid semver that orders by build time, which the desktop app's updater compares: one numeric
            # minute stamp (no leading zero), and the commit as build metadata (a hash can start with 0).
            version="${base:-0.0.0}-nightly.$(date -u +%Y%m%d%H%M)+${GITHUB_SHA::7}"
          fi
          # crates/fleetd lands during the Rust port; until then there is no CLI to build.
          has_cli=false
          if [ -f crates/fleetd/Cargo.toml ]; then has_cli=true; fi
          # Nightly rebuilds the app only when it changed since the build the nightly release carries. Comparing
          # with that build, not the previous push, means a cancelled run never drops an app change. Cargo.lock is
          # left out on purpose: it changes on most merges. Ship a dependency bump with force-app or a tag.
          build_app=true
          if [ "$CHANNEL" = nightly ] && [ "$PUBLISH" = true ] && [ "$FORCE_APP" != true ]; then
            prev="$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/release.json" 2>/dev/null | jq -r '.appCommit // empty' || true)"
            if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null &&
              git diff --quiet "$prev" HEAD -- app crates/fleetd-contracts; then
              build_app=false
            fi
            echo "app last built from: ${prev:-none}"
          fi
          echo "version=$version has-cli=$has_cli build-app=$build_app"
          {
            echo "version=$version"
            echo "has-cli=$has_cli"
            echo "build-app=$build_app"
          } >> "$GITHUB_OUTPUT"

  cli:
    needs: plan
    if: needs.plan.outputs.has-cli == 'true'
    # The release critical path. GitHub-hosted runners are free for this public repo; no paid larger runners.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLEETD_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-apple-darwin,x86_64-apple-darwin
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # One static musl binary for every Linux, and both darwin binaries, all from this Linux box. zig supplies the
      # C toolchain for SQLite and ring; it has no macOS SDK, which is why fleetd must not link a macOS framework.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4
      - name: No macOS framework dependencies
        run: .github/release/check-darwin-deps.sh
      - name: Build
        run: cargo zigbuild --release --locked -p fleetd --target x86_64-unknown-linux-musl --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Check and stage the binaries
        run: |
          objdump="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-objdump"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/fleetd dist/fleetd-linux-x64
          cp target/aarch64-apple-darwin/release/fleetd dist/fleetd-darwin-arm64
          cp target/x86_64-apple-darwin/release/fleetd dist/fleetd-darwin-x64
          if "$objdump" -p dist/fleetd-linux-x64 | grep NEEDED; then
            echo "::error::fleetd-linux-x64 is not static"; exit 1
          fi
          for bin in dist/fleetd-darwin-*; do
            "$objdump" --macho --dylibs-used "$bin"
            if "$objdump" --macho --dylibs-used "$bin" | grep -F '.framework/'; then
              echo "::error::$bin links a macOS framework; see .github/release/check-darwin-deps.sh"; exit 1
            fi
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: cli
          path: dist/
          if-no-files-found: error

  app-macos:
    needs: plan
    # Builds that publish, and manual dispatches from a branch (dry runs that also prove signing, notarization and
    # the key store on the signed app). Pull request dry runs skip it; PR CI already bundles the app on macOS.
    if: needs.plan.outputs.build-app == 'true' && (inputs.publish || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      FLEETD_VERSION: ${{ needs.plan.outputs.version }}
      # Developer ID signing runs only when the certificate secrets exist, notarization only when the notary key
      # does too; otherwise the app keeps the ad-hoc signature from macos-bundle.sh. See .github/release/macos-sign.sh.
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # fleetd-app only: built together with fleetd, cargo would unify their features (serde_json preserve_order).
      - name: Build arm64 and x86_64
        run: cargo build --release --locked -p fleetd-app --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Bundle a universal fleetd.app
        run: |
          app="$(app/packaging/macos-bundle.sh target/aarch64-apple-darwin/release/fleetd-app target/x86_64-apple-darwin/release/fleetd-app)"
          lipo -info "$app/Contents/MacOS/fleetd-app"
          mkdir -p dist
          mv "$app" dist/fleetd.app
      - name: Signing secrets
        id: secrets
        run: |
          echo "sign=$(.github/release/macos-sign.sh enabled)" >> "$GITHUB_OUTPUT"
          notarize=false
          if [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ] && [ -n "$NOTARY_KEY_P8_BASE64" ]; then notarize=true; fi
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
      - name: Sign with the Developer ID
        if: steps.secrets.outputs.sign == 'true'
        run: |
          .github/release/macos-sign.sh keychain
          .github/release/macos-sign.sh sign dist/fleetd.app
      - name: Notarize and staple
        id: notarize
        if: steps.secrets.outputs.sign == 'true' && steps.secrets.outputs.notarize == 'true'
        run: |
          ditto -c -k --keepParent dist/fleetd.app "$RUNNER_TEMP/fleetd-app-notarize.zip"
          rc=0
          .github/release/macos-sign.sh notarize "$RUNNER_TEMP/fleetd-app-notarize.zip" || rc=$?
          if [ "$rc" = 3 ]; then exit 0; fi
          [ "$rc" = 0 ] || exit "$rc"
          xcrun stapler staple dist/fleetd.app
          xcrun stapler validate dist/fleetd.app
          echo "stapled=true" >> "$GITHUB_OUTPUT"
      - name: Gatekeeper
        if: steps.secrets.outputs.sign == 'true'
        env:
          NOTARIZED: ${{ steps.notarize.outputs.stapled }}
        run: |
          codesign --verify --deep --strict --verbose=2 dist/fleetd.app
          out="$(spctl -a -vv -t exec dist/fleetd.app 2>&1 || true)"
          echo "$out"
          if [ "$NOTARIZED" = true ]; then
            if ! echo "$out" | grep -q ': accepted' || ! echo "$out" | grep -q 'source=Notarized Developer ID'; then
              echo "::error::Gatekeeper doesn't accept the notarized app"; exit 1
            fi
          else
            echo "not notarized yet: Gatekeeper rejecting a downloaded copy is expected"
          fi
      - name: No keychain prompt on launch (signed app, dry runs)
        # The signed app keeps its key in its own keychain item, trusted by Team ID, so it survives an update (the
        # check re-signs a copy with a new cdhash). Dry runs only: it overwrites this runner's fleetd items.
        if: steps.secrets.outputs.sign == 'true' && !inputs.publish
        run: app/packaging/macos-key-store-check.sh dist/fleetd.app keychain
      - name: Remove the signing keychain
        if: always()
        run: .github/release/macos-sign.sh cleanup
      - name: Zip
        run: |
          ditto -c -k --keepParent dist/fleetd.app dist/fleetd-app-macos-universal.zip
          rm -rf dist/fleetd.app
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: app-macos
          path: dist/
          if-no-files-found: error

  cli-macos:
    # Signs and notarizes the darwin CLI binaries the Linux job cross-built. Without the secrets it does nothing
    # and the unsigned binaries ship as before. A bare binary can't be stapled; Gatekeeper finds its ticket online.
    needs: [plan, cli]
    # Like app-macos: builds that publish and manual dispatches, not pull request dry runs.
    if: inputs.publish || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - name: Signing secrets
        id: secrets
        run: |
          echo "sign=$(.github/release/macos-sign.sh enabled)" >> "$GITHUB_OUTPUT"
          notarize=false
          if [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ] && [ -n "$NOTARY_KEY_P8_BASE64" ]; then notarize=true; fi
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.sign == 'true'
        uses: actions/download-artifact@v8
        with:
          name: cli
          path: dist
      - name: Sign with the Developer ID
        if: steps.secrets.outputs.sign == 'true'
        run: |
          .github/release/macos-sign.sh keychain
          chmod 755 dist/fleetd-darwin-*
          .github/release/macos-sign.sh sign dist/fleetd-darwin-arm64 dist/fleetd-darwin-x64
      - name: Notarize
        if: steps.secrets.outputs.sign == 'true' && steps.secrets.outputs.notarize == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/fleetd-cli"
          cp dist/fleetd-darwin-arm64 dist/fleetd-darwin-x64 "$RUNNER_TEMP/fleetd-cli/"
          ditto -c -k --keepParent "$RUNNER_TEMP/fleetd-cli" "$RUNNER_TEMP/fleetd-cli-notarize.zip"
          rc=0
          .github/release/macos-sign.sh notarize "$RUNNER_TEMP/fleetd-cli-notarize.zip" || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then exit "$rc"; fi
          # Logged, not enforced: Gatekeeper's verdict on a bare binary depends on fetching its ticket online.
          for bin in dist/fleetd-darwin-*; do
            echo "$bin: $(spctl -a -vv -t open --context context:primary-signature "$bin" 2>&1 | tr '\n' ' ' || true)"
          done
      - name: Remove the signing keychain
        if: always()
        run: .github/release/macos-sign.sh cleanup
      - if: steps.secrets.outputs.sign == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cli
          path: dist/
          if-no-files-found: error
          overwrite: true

  app-linux:
    needs: plan
    if: needs.plan.outputs.build-app == 'true'
    # 22.04, not 24.04: the binary needs the glibc it was linked against, and 22.04's 2.35 covers older distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FLEETD_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: GPUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libwayland-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked -p fleetd-app
      - name: Package
        run: |
          echo "needs glibc $(objdump -T target/release/fleetd-app | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          mkdir -p dist
          app/packaging/linux-package.sh target/release/fleetd-app dist/fleetd-app-linux-x64.tar.gz
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: app-linux
          path: dist/
          if-no-files-found: error

  desktop-macos:
    needs: plan
    # The Electron app, behind the `desktop` input until it replaces fleetd-app. Same runs as app-macos: builds that
    # publish and manual dispatches (a dispatch from a branch proves signing, notarization and the update feed).
    if: inputs.desktop && needs.plan.outputs.build-app == 'true' && (inputs.publish || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      FLEETD_VERSION: ${{ needs.plan.outputs.version }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - name: Build
        working-directory: app/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Signing secrets
        id: secrets
        run: |
          echo "sign=$(.github/release/macos-sign.sh enabled)" >> "$GITHUB_OUTPUT"
          notarize=false
          if [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ] && [ -n "$NOTARY_KEY_P8_BASE64" ]; then notarize=true; fi
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
      - name: Signing keychain
        if: steps.secrets.outputs.sign == 'true'
        run: .github/release/macos-sign.sh keychain
      - name: Package a universal fleetd.app
        working-directory: app/desktop
        env:
          SIGN: ${{ steps.secrets.outputs.sign }}
        run: |
          short="${FLEETD_VERSION%%[-+]*}"
          args=(--mac --publish never -c.extraMetadata.version="$FLEETD_VERSION" -c.buildVersion="$short" -c.mac.bundleShortVersion="$short")
          if [ "$SIGN" = true ]; then
            # electron-builder signs with the identity from the keychain above (it's on this job's search list) and
            # wants the name without its certificate-type prefix.
            export CSC_NAME="${MACOS_SIGN_IDENTITY#Developer ID Application: }"
          else
            # Forks: an ad-hoc signature, which library validation under the hardened runtime would refuse.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          pnpm exec electron-builder "${args[@]}"
          mkdir -p ../../dist
          mv dist/mac-universal/fleetd.app ../../dist/fleetd.app
          lipo -info ../../dist/fleetd.app/Contents/MacOS/fleetd
          plutil -p ../../dist/fleetd.app/Contents/Info.plist | grep -E 'CFBundle(Identifier|ShortVersionString|Version|URLSchemes)' -A1
      - name: Check the signature
        if: steps.secrets.outputs.sign == 'true'
        run: |
          .github/release/macos-sign.sh verify dist/fleetd.app
          codesign -d --entitlements - --xml dist/fleetd.app | plutil -p -
      - name: Load the native keyring module from the packed app
        # It reads the GPUI app's keychain item once; a native module only loads from outside the asar.
        run: |
          ELECTRON_RUN_AS_NODE=1 dist/fleetd.app/Contents/MacOS/fleetd -e \
            'const k = require(process.resourcesPath + "/app.asar/node_modules/@napi-rs/keyring"); console.log(process.arch, "keyring:", typeof k.Entry); if (typeof k.Entry !== "function") process.exit(1)'
          find dist/fleetd.app/Contents/Resources/app.asar.unpacked -name '*.node' -exec lipo -archs {} \; -print
      - name: Notarize and staple
        id: notarize
        if: steps.secrets.outputs.sign == 'true' && steps.secrets.outputs.notarize == 'true'
        run: |
          # The name is what macos-staple.sh looks for in the notary history when Apple outlasts NOTARY_WAIT.
          ditto -c -k --keepParent dist/fleetd.app "$RUNNER_TEMP/fleetd-desktop-notarize.zip"
          rc=0
          .github/release/macos-sign.sh notarize "$RUNNER_TEMP/fleetd-desktop-notarize.zip" || rc=$?
          if [ "$rc" = 3 ]; then exit 0; fi
          [ "$rc" = 0 ] || exit "$rc"
          xcrun stapler staple dist/fleetd.app
          xcrun stapler validate dist/fleetd.app
          echo "stapled=true" >> "$GITHUB_OUTPUT"
      - name: Gatekeeper
        if: steps.secrets.outputs.sign == 'true'
        env:
          NOTARIZED: ${{ steps.notarize.outputs.stapled }}
        run: |
          out="$(spctl -a -vv -t exec dist/fleetd.app 2>&1 || true)"
          echo "$out"
          if [ "$NOTARIZED" = true ]; then
            if ! echo "$out" | grep -q ': accepted' || ! echo "$out" | grep -q 'source=Notarized Developer ID'; then
              echo "::error::Gatekeeper doesn't accept the notarized app"; exit 1
            fi
          else
            echo "not notarized yet: Gatekeeper rejecting a downloaded copy is expected"
          fi
      - name: Remove the signing keychain
        if: always()
        run: .github/release/macos-sign.sh cleanup
      - name: Zip and write latest-mac.yml
        run: |
          ditto -c -k --keepParent dist/fleetd.app dist/fleetd-desktop-macos-universal.zip
          .github/release/update-yml.sh dist/fleetd-desktop-macos-universal.zip "$FLEETD_VERSION" > dist/latest-mac.yml
          cat dist/latest-mac.yml
      - name: Launch the signed app and update it from a local feed
        # Squirrel.Mac only takes an update signed like the running app, so ad-hoc builds can't do this.
        if: steps.secrets.outputs.sign == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/launch"
          ditto dist/fleetd.app "$RUNNER_TEMP/launch/fleetd.app"
          .github/release/desktop-update-check.sh dist/fleetd-desktop-macos-universal.zip "$RUNNER_TEMP/launch/fleetd.app/Contents/MacOS/fleetd"
      - name: Stage
        run: |
          rm -rf dist/fleetd.app
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: dist/
          if-no-files-found: error

  desktop-linux:
    needs: plan
    if: inputs.desktop && needs.plan.outputs.build-app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLEETD_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - name: Build, then package an AppImage and a deb
        working-directory: app/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec electron-builder --linux --publish never -c.extraMetadata.version="$FLEETD_VERSION"
          mkdir -p ../../dist
          mv dist/fleetd-desktop-linux-x86_64.AppImage dist/fleetd-desktop-linux-amd64.deb ../../dist/
          dpkg-deb -I ../../dist/fleetd-desktop-linux-amd64.deb | grep -E '^ (Package|Version|Depends):'
      - name: Write latest-linux.yml
        # The AppImage only: the deb is updated by the installer or the package manager (see src/main/updater.ts).
        run: |
          .github/release/update-yml.sh dist/fleetd-desktop-linux-x86_64.AppImage "$FLEETD_VERSION" > dist/latest-linux.yml
          cat dist/latest-linux.yml
      - name: Launch the AppImage and update it from a local feed
        run: |
          cp dist/fleetd-desktop-linux-x86_64.AppImage "$RUNNER_TEMP/fleetd.AppImage"
          # No FUSE or display on the runner; Ubuntu's AppArmor refuses Chromium's user-namespace sandbox.
          .github/release/desktop-update-check.sh dist/fleetd-desktop-linux-x86_64.AppImage \
            "$RUNNER_TEMP/fleetd.AppImage" --appimage-extract-and-run --no-sandbox --ozone-platform=headless
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: dist/
          if-no-files-found: error

  publish:
    needs: [plan, cli, cli-macos, app-macos, app-linux, desktop-macos, desktop-linux]
    # Skipped builds (no CLI yet, app unchanged) must not skip publishing; failed or cancelled ones must.
    if: >-
      always() && inputs.publish && needs.plan.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
          APP_BUILT: ${{ needs.plan.outputs.build-app }}
          # crates/fleetd is a stub until the Rust cutover; set this repo variable to true to ship the CLI.
          CLI_PUBLISH: ${{ vars.FLEETD_RELEASE_CLI == 'true' }}
        run: .github/release/publish.sh
