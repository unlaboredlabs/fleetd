name: macOS label

# Adding `macos` to a PR (by hand) runs Desktop QA on its branch with its macOS leg, which never decides a merge (D158,
# desktop-qa.yml). CI's macOS jobs need no label: they run on every PR whose paths call for them (ci.yml). The label is
# caught here rather than in desktop-qa.yml: a `labeled` run there for any other label would add skipped check runs
# that replace the PR's real results (the merge train and GitHub keep only the newest run of each check). Nothing is
# dispatched for the train's batch PR, nor once the branch has moved since the label went on: that push's own run sees
# the label and runs the macOS leg.
#
# The dispatched run has a concurrency group of its own (desktop-qa.yml): one that joined the PR's would cancel the
# PR's own run on the same head. So nothing else cancels it, and the PR's next push does it (label-runs-stale.yml).

on:
  pull_request:
    types: [labeled]

permissions:
  actions: write

jobs:
  dispatch:
    if: ${{ !endsWith(github.head_ref, 'train/batch') && github.event.label.name == 'macos' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
          LABELLED: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" -q .object.sha)" != "$LABELLED" ]; then
            echo "$BRANCH moved since the label went on: its own run has the macOS leg"
            exit 0
          fi
          gh workflow run desktop-qa.yml --ref "$BRANCH" -f pr="$PR"
