# Builds what a node needs for sandbox VMs and fleetd makes itself (fleetd/src/sandbox/image/: the root image, a
# static virtiofsd and passt) and publishes them to the prerelease `vm-<key>`, where the key is the hash of the recipe
# (recipe.ts). A node fetches that release by the key its own build carries, so a release exists once per recipe and
# is never replaced: a push that leaves the recipe alone finds the release there and builds nothing. Never marked
# latest, so `fleetd update` and the installer don't see it.
# Pull requests that change the recipe build it as a dry run, keeping the build as the run's artifact for 3 days.
name: VM image

on:
  push:
    branches: [main]
    paths:
      - fleetd/src/sandbox/image/**
      - .github/workflows/vm-image.yml
  pull_request:
    paths:
      - fleetd/src/sandbox/image/**
      - .github/workflows/vm-image.yml
  workflow_dispatch:

concurrency:
  group: vm-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # As ci.yml's.
          bun-version: 1.4.3
      - id: recipe
        run: |
          tag="$(bun fleetd/src/sandbox/image/recipe.ts | jq -r .tag)"
          there=false
          if [ "$PUBLISH" = true ] && gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS; then
            there=true
          fi
          echo "tag=$tag published=$there"
          { echo "tag=$tag"; echo "published=$there"; } >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.recipe.outputs.published != 'true'
        run: fleetd/src/sandbox/image/build.sh "$RUNNER_TEMP/vm"
      - name: Keep (dry run)
        if: steps.recipe.outputs.published != 'true' && env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vm-${{ steps.recipe.outputs.tag }}
          path: ${{ runner.temp }}/vm/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Publish
        if: steps.recipe.outputs.published != 'true' && env.PUBLISH == 'true'
        env:
          TAG: ${{ steps.recipe.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP/vm"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # One a cancelled run left half done: the files go up again, SHA256SUMS last.
            gh release upload "$TAG" --clobber root-x86_64.ext4.zst virtiofsd-x86_64 passt-x86_64
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false --title "Sandbox VM files $TAG" \
              --notes "The root image, virtiofsd and passt a node fetches for sandbox VMs, built from fleetd/src/sandbox/image at $GITHUB_SHA." \
              root-x86_64.ext4.zst virtiofsd-x86_64 passt-x86_64
          fi
          gh release upload "$TAG" --clobber SHA256SUMS
