name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Built CLI runs
        run: node apps/cli/dist/bin.js --version

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # gpui is ~600 crates; the first uncached build takes a while.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: GPUI build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libwayland-dev libvulkan-dev
      - name: Use Command Line Tools only (macOS)
        # Proves the app builds without full Xcode: gpui's runtime_shaders feature skips `xcrun metal`.
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          xcode-select -p
          if xcrun --find metal 2>/dev/null; then echo "metal compiler unexpectedly present"; fi
      - run: cargo check --locked --all-targets
      - run: cargo test --locked
      - run: cargo build --locked -p fleetd-app
