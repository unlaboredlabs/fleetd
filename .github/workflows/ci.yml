name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Everything runs on GitHub-hosted runners, which are free for public repos. Rust caches are saved from main only:
# the repo's 10 GB cache quota holds one copy per job, and pull requests restore main's.

jobs:
  rust-crates:
    # The root Cargo workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Generated contracts are current
        # crates/fleetd-contracts/schema/*.json and the desktop app's TypeScript
        # (app/desktop/src/shared/contracts/generated/) are generated from the Rust contracts. This fails when either
        # differs from a fresh render, a hand edit included. Fix: cargo run -p fleetd-contracts --bin fleetd-schema.
        run: cargo run --locked -q -p fleetd-contracts --bin fleetd-schema -- --check
      - name: Claude runner conformance (fixtures)
        # CI has no claude. The streams recorded from claude at version.rs TESTED go through the decoders, the
        # failure classifier and the conformance probe (against a stand-in replaying the recorded initialize
        # answer). Its own step so a claude protocol drift reads as such; re-record the fixtures when bumping TESTED.
        run: cargo test --locked -p fleetd --lib node::runner
      - name: The docs' generated pages are up to date
        # The CLI reference, the Agent tools page and the prompt table in docs/site/src/content/docs come from the
        # code. This fails while they differ from a fresh render. Fix: cargo run -q -p docsgen, then rebuild and commit
        # (site/README.md).
        run: cargo run --locked -q -p docsgen -- --check
      # For the site job. The dependencies are already built by the tests, so this compiles only the binary.
      - run: cargo run --locked -q -p fleetd -- help > "$RUNNER_TEMP/fleetd-help.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: fleetd-help
          path: ${{ runner.temp }}/fleetd-help.txt
          retention-days: 1

  site:
    # fleetd.sh may only mention what fleetd has: no index.* at the root of site/ (Vercel would serve it at / instead
    # of the installer), nothing from site/.stale-terms, and only `fleetd` commands that `fleetd help` lists, on the
    # landing page and in the docs' sources; every vercel.json rewrite lands on a file (under cleanUrls) and `/` is the
    # landing page for a browser and install.sh for curl; site/docs is the docs' current build; every link on the site
    # resolves; no tracked file names a maintainer's own machine, login or home directory; and the landing page's figure
    # callouts don't overlap at any width.
    needs: rust-crates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: fleetd.sh/docs is the current build
        # site/docs/ is committed (the Vercel project has no build step). This fails while it differs from a fresh
        # Starlight build of docs/site. Fix: npm ci --prefix docs/site && npm run build --prefix docs/site, then commit.
        # The search index (site/docs/pagefind) is left out: Pagefind chunks it in the order the filesystem lists the
        # pages, which differs between machines, and it is built from the same HTML in the same run.
        run: |
          npm ci --prefix docs/site --no-audit --no-fund
          npm run build --prefix docs/site
          if [ -n "$(git status --porcelain -- site/docs ':!site/docs/pagefind')" ]; then
            git status --short -- site/docs ':!site/docs/pagefind' | head -20
            echo "::error::site/docs differs from a fresh build of docs/site; rebuild and commit it (site/README.md, Docs)"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: fleetd-help
          path: ${{ runner.temp }}
      - run: node .github/site-check.mjs "$RUNNER_TEMP/fleetd-help.txt"
      - name: No personal identifiers
        run: node .github/personal-check.mjs
      - name: Internal links and anchors
        run: node .github/docs-links.mjs
      - name: Figure callouts don't collide
        # Renders site/home.html in the runner's google-chrome at 390 to 1920 px wide and fails when two callout notes
        # of a figure overlap or one leaves the viewport.
        run: node .github/site-layout-check.mjs

  site-external-links:
    # Every external link on fleetd.sh and its docs answers (10 s a try, two tries). Links into this repo on GitHub
    # are checked against the checkout by the site job instead.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/docs-links.mjs --external

  rust:
    # What rust-crates can't check on its own: on both OSes, that libsodium (in Node, as the desktop app seals) opens
    # what the node's Rust seals and the other way round; on macOS, the node's power code (IOKit). `rust (linux)` and
    # `rust (macos)` are required checks.
    strategy:
      matrix:
        os: [linux, macos]
    runs-on: ${{ matrix.os == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Scope
        # The macOS leg does the work only when the node's code, the dependency set or this workflow changed;
        # otherwise it reports success at once. HEAD^1 is the base for a PR's merge commit and the previous main for a
        # (squash-merged) push. The rest of crates/fleetd's macOS code is cross-built and checked by darwin-deps and
        # the nightly.
        id: scope
        run: |
          run=true
          if [ "$RUNNER_OS" = macOS ] && git rev-parse -q --verify HEAD^1 >/dev/null &&
            git diff --quiet HEAD^1 HEAD -- crates/fleetd/src/node Cargo.toml Cargo.lock .github/workflows/ci.yml; then
            run=false
            echo "Nothing macOS-relevant changed; the Linux leg covers this."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/lab/package-lock.json
      - if: steps.scope.outputs.run == 'true'
        run: npm ci --prefix tests/lab --no-audit --no-fund
      - if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Sealed boxes against libsodium
        if: steps.scope.outputs.run == 'true'
        run: cargo test --locked -p fleetd --lib node::identity
        env:
          FLEETD_REQUIRE_NODE_SEAL: "1"
      - name: Node power on macOS
        # The sleep assertion and the wake clock, natively: the test takes a real assertion on the runner and
        # releases it.
        if: runner.os == 'macOS' && steps.scope.outputs.run == 'true'
        run: cargo test --locked -p fleetd --lib node::power

  darwin-deps:
    # The release cross-builds the darwin fleetd binaries on Linux, which breaks on any crate that links a macOS
    # framework. Catch one here, before it lands on main.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - if: hashFiles('crates/fleetd/Cargo.toml') != ''
        run: .github/release/check-darwin-deps.sh

  desktop:
    # app/desktop, the Electron app (its own pnpm workspace): typecheck, lint, unit tests and a build. Runs when
    # app/desktop or this workflow changed; otherwise it reports success at once, so it can be a required check.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Scope
        id: scope
        working-directory: .
        run: |
          run=true
          if git rev-parse -q --verify HEAD^1 >/dev/null && git diff --quiet HEAD^1 HEAD -- app/desktop .github/workflows/ci.yml; then
            run=false
            echo "app/desktop didn't change."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - if: steps.scope.outputs.run == 'true'
        name: No paths that differ only in case
        # macOS checkouts are case-insensitive: Composer.tsx beside composer.ts breaks the Mac build and the
        # "./composer" import alike, so the extension is ignored too.
        run: |
          clashes=$(git ls-files | sed -E 's/\.[^./]+$//' | awk '{ l = tolower($0) } (l in seen) && seen[l] != $0 { print seen[l] " / " $0; next } { seen[l] = $0 }')
          if [ -n "$clashes" ]; then echo "Paths that differ only in case (rename one):"; echo "$clashes"; exit 1; fi
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.run == 'true'
        run: pnpm typecheck
      - if: steps.scope.outputs.run == 'true'
        run: pnpm lint
      - if: steps.scope.outputs.run == 'true'
        run: pnpm test
      - if: steps.scope.outputs.run == 'true'
        run: pnpm build
      - name: A release build refuses debugging switches
        # Builds both variants, lays each out as a packaged app and launches it: with a DevTools switch the release
        # build must exit before anything listens; the test build must still listen. The fuse-only cases (--inspect)
        # run against the real package in build-release.yml.
        if: steps.scope.outputs.run == 'true'
        run: pnpm debug-guard-check
      - name: Test build (DevTools-driven perf and recording)
        # The release build refuses --remote-debugging-port, which the perf and recording runs drive the app with.
        if: steps.scope.outputs.run == 'true'
        run: pnpm build:test
      - name: Packaged smoke (Linux)
        # The nightly's smoke (build-release.yml) on that test build, packed as the nightly packs it: otherwise a PR
        # that renames or removes a screen breaks only the nightly. Headless, so no virtual display.
        if: steps.scope.outputs.run == 'true'
        run: |
          pnpm fixtures
          pnpm exec electron-builder --linux --dir --publish never -c.directories.output=dist-test
          node scripts/packaged-smoke.ts dist-test/linux-unpacked/fleetd-desktop --no-sandbox --ozone-platform=headless
      - if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packaged-smoke-linux
          path: app/desktop/smoke-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Budgets (Linux)
        # Measured on this runner, not the budget machine (an M-series Mac: scripts/perf-mac.sh), so this fails on a
        # regression from perf/baseline-linux.json and only reports the budgets. The numbers go to the job summary.
        if: steps.scope.outputs.run == 'true'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" pnpm perf --baseline perf/baseline-linux.json --json "$RUNNER_TEMP/perf.json"
      - name: Demo recording (Linux)
        # FLEETD_RECORD + FLEETD_DEMO_TYPE end to end: the app records itself typing an order, the clip ends on
        # SIGUSR1, and both MP4s must be H.264 with frames.
        if: steps.scope.outputs.run == 'true'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" pnpm perf:record

  desktop-macos:
    # The nightly's macOS packaged smoke (build-release.yml, desktop-macos) on an ad-hoc signed arm64 test build, so a
    # change that breaks the packed mac app fails here rather than only in the nightly. Same scope as desktop.
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Scope
        id: scope
        working-directory: .
        run: |
          run=true
          if git rev-parse -q --verify HEAD^1 >/dev/null && git diff --quiet HEAD^1 HEAD -- app/desktop .github/workflows/ci.yml; then
            run=false
            echo "app/desktop didn't change."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Packaged smoke (macOS)
        if: steps.scope.outputs.run == 'true'
        run: |
          pnpm fixtures
          pnpm build:test
          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac --dir --arm64 --publish never -c.directories.output=dist-test \
            -c.mac.identity=- -c.mac.hardenedRuntime=false
          node scripts/packaged-smoke.ts dist-test/mac-arm64/fleetd.app/Contents/MacOS/fleetd
      - if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packaged-smoke-macos
          path: app/desktop/smoke-results/
          if-no-files-found: ignore
          retention-days: 14

  desktop-macos-repro:
    # TEMPORARY (removed before merge): the nightly's mac job up to its smoke, signed as it is (no notarization, nothing
    # published), so Squirrel.Mac really stages the update before the smoke runs.
    strategy:
      fail-fast: false
      matrix:
        variant: [signed, plain-1, plain-2]
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Signing keychain
        if: matrix.variant == 'signed'
        working-directory: .
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: .github/release/macos-sign.sh keychain
      - name: Package a signed universal fleetd.app
        if: matrix.variant == 'signed'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          export CSC_NAME="${MACOS_SIGN_IDENTITY#Developer ID Application: }"
          pnpm exec electron-builder --mac --publish never -c.extraMetadata.version=0.0.0-nightly.202610220936+5c4cc17 -c.buildVersion=0.0.0 -c.mac.bundleShortVersion=0.0.0
          mkdir -p ../../dist && mv dist/mac-universal/fleetd.app ../../dist/fleetd.app
      - name: Remove the signing keychain
        if: always() && matrix.variant == 'signed'
        working-directory: .
        run: .github/release/macos-sign.sh cleanup
      - name: Launch the signed app and update it from a local feed
        if: matrix.variant == 'signed'
        working-directory: .
        run: |
          ditto -c -k --keepParent --norsrc dist/fleetd.app dist/fleetd-desktop-macos-universal.zip
          mkdir -p "$RUNNER_TEMP/launch"
          ditto dist/fleetd.app "$RUNNER_TEMP/launch/fleetd.app"
          .github/release/desktop-update-check.sh dist/fleetd-desktop-macos-universal.zip "$RUNNER_TEMP/launch/fleetd.app/Contents/MacOS/fleetd"
      - name: Packaged smoke
        run: |
          pnpm fixtures
          pnpm build:test
          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac --dir --arm64 --publish never -c.directories.output=dist-test \
            -c.mac.identity=- -c.mac.hardenedRuntime=false -c.extraMetadata.version=0.0.0-nightly.202610220936+5c4cc17
          ps -axo pid,etime,command | grep -iE 'fleetd|ShipIt' | grep -v grep || true
          fails=0
          for i in $(seq 10); do
            if node scripts/packaged-smoke.ts dist-test/mac-arm64/fleetd.app/Contents/MacOS/fleetd > "$RUNNER_TEMP/smoke-$i.log" 2>&1; then
              echo "run $i: ok"
            else
              fails=$((fails+1)); echo "run $i: FAILED"; grep -vE 'ERROR:|^ERR: ' "$RUNNER_TEMP/smoke-$i.log" | tail -40
              [ -d smoke-results ] && mv smoke-results "smoke-results-$i"
            fi
          done
          mkdir -p smoke-results && mv smoke-results-* smoke-results/ 2>/dev/null || true
          echo "failed $fails of 10"
          [ "$fails" = 0 ]
      - if: always()
        name: What else was running
        run: |
          ps -axo pid,etime,%cpu,command | grep -iE 'fleetd|ShipIt|syspolicy|XProtect' | grep -v grep || true
          ls -la ~/Library/Caches/sh.fleetd.app.ShipIt 2>/dev/null || true
          cat ~/Library/Caches/sh.fleetd.app.ShipIt/ShipIt_stderr.log 2>/dev/null | tail -30 || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ matrix.variant }}
          path: app/desktop/smoke-results/
          if-no-files-found: ignore
          retention-days: 7
