name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a PR cancels its running CI. Runs on main and on the merge train's batch PR (<prefix>train/batch) are
# never cancelled: each gets a group of its own.
concurrency:
  group: >-
    ${{ (github.ref == 'refs/heads/main' || endsWith(github.head_ref || github.ref, 'train/batch'))
    && format('{0}-{1}', github.workflow, github.run_id)
    || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !endsWith(github.head_ref || github.ref, 'train/batch') }}

permissions:
  contents: read

# No debug info: the build, its link and the cache each job restores are smaller and quicker. Backtraces still name
# each function, without its file and line.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"

# Everything runs on GitHub-hosted runners, which are free for public repos. Rust caches are saved from main only:
# the repo's 10 GB cache quota holds one copy per job, and pull requests restore main's.
#
# No job here runs on macOS (ci.no-macos-on-prs). What a PR's macOS code can break is checked on Linux: `rust (darwin)`
# lints the workspace for both darwin targets, so code under cfg(target_os = "macos") must compile, and
# `desktop (mac layout)` packs the mac app and checks its layout. What only a Mac can run (IOKit, sandbox-exec, iOS
# simulator sessions, macOS desktop QA, the packed mac app, the iOS build) runs nightly in mac.yml, and before each
# release.

jobs:
  rust-lint:
    # Like the other Rust jobs, only when a Rust-related path changed (.github/rust-scope.sh); otherwise it reports
    # success at once.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run from a branch compares with its merge base on main, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        id: scope
        run: .github/rust-scope.sh
      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'
        with:
          components: rustfmt, clippy
      - name: Hub migrations only add new files, after the base's
        if: steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          node .github/migrations-check.mjs FETCH_HEAD
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
        if: steps.scope.outputs.run == 'true'
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        if: steps.scope.outputs.run == 'true'

  rust-docs:
    # The docs' generated pages, `fleetd help` for the site job, and the lab scenarios, all on one debug build. Without
    # a Rust change (.github/rust-scope.sh) it only hands the site job main's `fleetd help`, or builds it when main has
    # none kept.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run from a branch compares with its merge base on main, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        id: scope
        run: .github/rust-scope.sh
      - name: fleetd help from main's build
        id: help
        if: steps.scope.outputs.run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Only this repo's own push runs on main, newest first: a fork's PR from a branch named main runs as a
        # pull_request, so its artifact never stands in for main's.
        run: |
          runs=$(gh run list --workflow ci.yml --branch main --event push --limit 10 --json databaseId -q '.[].databaseId' || true)
          for run in $runs; do
            if gh run download "$run" -n fleetd-help -D "$RUNNER_TEMP" 2>/dev/null; then
              echo "From main's run $run."
              echo "from=main" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::notice::main has no fleetd help kept; building it"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.help.outputs.from != 'main'
      - uses: Swatinem/rust-cache@v2
        if: steps.help.outputs.from != 'main'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked -p fleetd -p docsgen
        if: steps.help.outputs.from != 'main'
      - name: The docs' generated pages are up to date
        if: steps.scope.outputs.run == 'true'
        # The CLI reference, the Agent tools page and the prompt table in docs/site/src/content/docs come from the
        # code. This fails while they differ from a fresh render. Fix: cargo run -q -p docsgen, then rebuild and commit
        # (site/README.md).
        run: cargo run --locked -q -p docsgen -- --check
      # For the site job; main's is kept two weeks, for the PRs without a Rust change.
      - run: target/debug/fleetd help > "$RUNNER_TEMP/fleetd-help.txt"
        if: steps.help.outputs.from != 'main'
      - uses: actions/upload-artifact@v7
        with:
          name: fleetd-help
          path: ${{ runner.temp }}/fleetd-help.txt
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 1 }}
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/lab/package-lock.json
      - run: npm ci --prefix tests/lab --no-audit --no-fund
        if: steps.scope.outputs.run == 'true'
      - name: Lab scenarios on a project that isn't fleetd
        if: steps.scope.outputs.run == 'true'
        # W9's tests/lab/factory, on the debug binary built above: a hub and a node on a generated Python repo with a
        # local ssh-style origin, and an offline stand-in for claude. No network, GitHub or claude login.
        run: npm run factory --prefix tests/lab
        env:
          FLEETD_BIN: ${{ github.workspace }}/target/debug/fleetd
          FLEETD_FACTORY_DIR: ${{ runner.temp }}/factory
      - if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lab-factory-logs
          path: ${{ runner.temp }}/factory/*/logs/
          if-no-files-found: ignore
          retention-days: 14

  site:
    # fleetd.sh may only mention what fleetd has: no index.* at the root of site/ (Vercel would serve it at / instead
    # of the installer), nothing from site/.stale-terms, and only `fleetd` commands that `fleetd help` lists, on the
    # landing page and in the docs' sources; every vercel.json rewrite lands on a file (under cleanUrls) and `/` is the
    # landing page for a browser and install.sh for curl; site/docs is the docs' current build; every link on the site
    # resolves; no tracked file names a maintainer's own machine, login or home directory; and the landing page fits
    # every width.
    needs: rust-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: fleetd.sh/docs is the current build
        # site/docs/ is committed. This fails while it differs from a fresh Starlight build of docs/site. Fix: npm ci
        # --prefix docs/site && npm run build --prefix docs/site, then commit. The search index (site/docs/pagefind) is
        # not committed but ignored: the Vercel build of site/ generates it (site/vercel.json's buildCommand), so docs
        # PRs don't conflict on it.
        run: |
          npm ci --prefix docs/site --no-audit --no-fund
          npm run build --prefix docs/site
          if [ -n "$(git ls-files site/docs/pagefind)" ]; then
            echo "::error::site/docs/pagefind is tracked; the Vercel build generates it: git rm -r --cached site/docs/pagefind"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- site/docs)" ]; then
            git status --short -- site/docs | head -20
            echo "::error::site/docs differs from a fresh build of docs/site; rebuild and commit it (site/README.md, Docs)"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: fleetd-help
          path: ${{ runner.temp }}
      - run: node .github/site-check.mjs "$RUNNER_TEMP/fleetd-help.txt"
      - name: No personal identifiers
        run: node .github/personal-check.mjs
      - name: Internal links and anchors
        run: node .github/docs-links.mjs
      - name: Landing page fits every width
        # Renders site/home.html in the runner's google-chrome at 320 to 1920 px wide and fails when the page scrolls
        # sideways.
        run: node .github/site-layout-check.mjs

  site-external-links:
    # Every external link on fleetd.sh and its docs answers (10 s a try, two tries). Links into this repo on GitHub
    # are checked against the checkout by the site job instead. It reaches other sites, which fail now and then on
    # their own, so it runs after the merge (.fleetd/train.json afterMerge: a failure on main opens a fix order), not
    # on PRs; site-links.yml runs it nightly too, as links break without a commit.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/docs-links.mjs --external

  rust:
    # The root Cargo workspace's tests, under cargo-nextest (a process per test; .config/nextest.toml retries the
    # Chrome-driven browser tests and reports those as flaky), and its doctests. Lint (fmt, clippy) and the docs and lab
    # checks on the built binary are jobs of their own, beside this one. `rust (linux)` is a required check,
    # so the workspace tests gate merges.
    #
    # The tests also check that the generated contracts (schema/*.json and the app's TypeScript) are current
    # (schema::generated_contracts_are_current) and replay the recorded claude fixtures (node::runner). Here, what
    # they'd skip elsewhere must run: the FLEETD_REQUIRE_* variables make these fail instead of skip without their tool.
    # - libsodium (in Node, as the desktop app seals) opens what the node's Rust seals and the other way round
    #   (node::identity; mac.yml runs the same on macOS nightly).
    # - The pinned agent-browser (agent_browser.rs's VERSION), on the runner's Chrome: every script its commands send is
    #   one of the pinned shapes (agent_browser_shapes.json) and a sealed session runs it, and its commands work after
    #   a fill.
    # - A Navi's sandbox holds under bubblewrap (node::runner::sandbox): a Navi can't write outside its folder or read
    #   the token store, and works as usual inside it.
    #
    # Only when a Rust-related path changed (.github/rust-scope.sh): otherwise it reports success at once, so the
    # required check reports on every PR and a skip never stands in for it.
    name: rust (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run from a branch compares with its merge base on main, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        id: scope
        run: .github/rust-scope.sh
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/lab/package-lock.json
      - run: npm ci --prefix tests/lab --no-audit --no-fund
        if: steps.scope.outputs.run == 'true'
      - name: agent-browser, as pinned
        if: steps.scope.outputs.run == 'true'
        run: |
          version="$(sed -n 's/^pub const VERSION: &str = "\(.*\)";$/\1/p' crates/fleetd/src/node/browser/agent_browser.rs)"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/agent-browser" "agent-browser@$version"
          # The package carries each platform's binary itself; its install script only links one, so skipping it
          # leaves them all in bin/. Fail here, plainly, if this one isn't there or doesn't run.
          bin="$RUNNER_TEMP/agent-browser/node_modules/agent-browser/bin/agent-browser-linux-x64"
          test -f "$bin" || { ls -l "$(dirname "$bin")"; echo "no $bin in agent-browser@$version" >&2; exit 1; }
          chmod +x "$bin"
          "$bin" --version | grep -F "$version"
          echo "FLEETD_TEST_AGENT_BROWSER=$bin" >> "$GITHUB_ENV"
      - name: bubblewrap
        if: steps.scope.outputs.run == 'true'
        # Ubuntu's AppArmor blocks the user namespaces bwrap needs unless a profile allows them; the runner turns the
        # restriction off.
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all true
      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'
      - uses: taiki-e/install-action@v2
        if: steps.scope.outputs.run == 'true'
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Workspace tests
        if: steps.scope.outputs.run == 'true'
        run: cargo nextest run --locked --workspace --profile ci
        env:
          FLEETD_REQUIRE_NODE_SEAL: "1"
          FLEETD_REQUIRE_AGENT_BROWSER: "1"
          FLEETD_REQUIRE_SANDBOX: "1"
      # nextest doesn't run doctests.
      - name: Doctests
        if: steps.scope.outputs.run == 'true'
        run: cargo test --locked --workspace --doc

  rust-darwin:
    # The workspace's clippy for both darwin targets, cross-checked on Linux with cargo-zigbuild as the release
    # cross-builds them: code under cfg(target_os = "macos") that doesn't compile, or warns, fails here. It runs nothing;
    # mac.yml runs the macOS-only tests nightly. Like the other Rust jobs, only when a Rust-related path changed
    # (.github/rust-scope.sh); otherwise it reports success at once, as the train waits for it (.fleetd/train.json).
    name: rust (darwin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run from a branch compares with its merge base on main, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        id: scope
        run: .github/rust-scope.sh
      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # zig is the C toolchain for SQLite's and ring's build scripts, the version build-release.yml's cli job uses. It
      # comes from the cache, keyed by version; on a miss, from ziglang.org itself, checked against its published
      # sha256, rather than setup-zig's community mirrors on every run of a check that gates merges.
      - id: zig
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: ~/zig
          key: zig-0.17.0-x86_64-linux
      - if: steps.scope.outputs.run == 'true' && steps.zig.outputs.cache-hit != 'true'
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p ~/zig
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C ~/zig --strip-components=1
      - if: steps.scope.outputs.run == 'true'
        run: echo "$HOME/zig" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        if: steps.scope.outputs.run == 'true'
        with:
          tool: cargo-zigbuild@0.23.4
      - if: steps.scope.outputs.run == 'true'
        run: cargo-zigbuild clippy --locked --workspace --all-targets --target aarch64-apple-darwin --target x86_64-apple-darwin -- -D warnings

  darwin-deps:
    # The release cross-builds the darwin fleetd binaries on Linux, which breaks on any crate that links a macOS
    # framework. Catch one here, before it lands on main.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - if: hashFiles('crates/fleetd/Cargo.toml') != ''
        run: .github/release/check-darwin-deps.sh

  desktop:
    # app/desktop, the Electron app (its own pnpm workspace): typecheck, lint, unit tests and a build. Runs when
    # app/desktop or this workflow changed; otherwise it reports success at once, so it can be a required check.
    # desktop-packaged runs the packed app and its budgets beside it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run from a branch compares with its merge base on main, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        id: scope
        working-directory: .
        run: |
          run=true
          base=$(git rev-parse -q --verify HEAD^1 || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            base=$(git merge-base origin/main HEAD || true)
          fi
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- app/desktop .github/workflows/ci.yml; then
            run=false
            echo "app/desktop didn't change."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - if: steps.scope.outputs.run == 'true'
        name: No paths that differ only in case
        # macOS checkouts are case-insensitive: Composer.tsx beside composer.ts breaks the Mac build and the
        # "./composer" import alike, so the extension is ignored too.
        run: |
          clashes=$(git ls-files | sed -E 's/\.[^./]+$//' | awk '{ l = tolower($0) } (l in seen) && seen[l] != $0 { print seen[l] " / " $0; next } { seen[l] = $0 }')
          if [ -n "$clashes" ]; then echo "Paths that differ only in case (rename one):"; echo "$clashes"; exit 1; fi
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.run == 'true'
        run: pnpm typecheck
      - if: steps.scope.outputs.run == 'true'
        run: pnpm lint
      - if: steps.scope.outputs.run == 'true'
        run: pnpm test
      - if: steps.scope.outputs.run == 'true'
        run: pnpm build
      - name: A release build refuses debugging switches
        # Builds both variants, lays each out as a packaged app and launches it: with a DevTools switch the release
        # build must exit before anything listens; the test build must still listen. The fuse-only cases (--inspect)
        # run against the real package in build-release.yml.
        if: steps.scope.outputs.run == 'true'
        run: pnpm debug-guard-check

  desktop-packaged:
    # The test build of app/desktop, packed and run: the edge build's smoke and the recordings. Same scope as desktop.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run from a branch compares with its merge base on main, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        id: scope
        working-directory: .
        run: |
          run=true
          base=$(git rev-parse -q --verify HEAD^1 || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            base=$(git merge-base origin/main HEAD || true)
          fi
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- app/desktop .github/workflows/ci.yml; then
            run=false
            echo "app/desktop didn't change."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Test build (DevTools-driven perf and recording)
        # The release build refuses --remote-debugging-port, which the perf and recording runs drive the app with.
        if: steps.scope.outputs.run == 'true'
        run: pnpm build:test
      - name: Fixtures key
        # A hash of every file `pnpm fixtures` reads; a hit skips the build.
        if: steps.scope.outputs.run == 'true'
        id: fixtures-key
        run: echo "key=$(node scripts/fixtures-key.ts)" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        id: fixtures
        uses: actions/cache@v5
        with:
          path: app/desktop/fixtures/*.json
          key: fixtures-${{ runner.os }}-${{ steps.fixtures-key.outputs.key }}
      - name: Fixtures
        # Built once for the steps below: `pnpm perf:record` would build them again (a minute).
        if: steps.scope.outputs.run == 'true' && steps.fixtures.outputs.cache-hit != 'true'
        run: pnpm fixtures
      - name: Packaged smoke (Linux)
        # The edge build's smoke (build-release.yml) on that test build, packed as the edge build packs it: otherwise a
        # PR that renames or removes a screen breaks only the edge build. Headless, so no virtual display.
        if: steps.scope.outputs.run == 'true'
        run: |
          pnpm exec electron-builder --linux --dir --publish never -c.directories.output=dist-test
          node scripts/packaged-smoke.ts dist-test/linux-unpacked/fleetd-desktop --no-sandbox --ozone-platform=headless
      - name: Packaged recording (Linux)
        # FLEETD_RECORD in the packed app, which loads the recorder page from the asar; Demo recording below runs out/.
        if: steps.scope.outputs.run == 'true'
        run: node scripts/packaged-smoke.ts --record dist-test/linux-unpacked/fleetd-desktop --no-sandbox --ozone-platform=headless
      - if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packaged-smoke-linux
          path: app/desktop/smoke-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Demo recording (Linux)
        # FLEETD_RECORD + FLEETD_DEMO_TYPE end to end: the app records itself typing an order, the clip ends on
        # SIGUSR1, and both MP4s must be H.264 with frames.
        if: steps.scope.outputs.run == 'true'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" node perf/record-smoke.ts

  desktop-budgets:
    # app/desktop's Linux perf budgets on the test build, after the merge (.fleetd/train.json afterMerge: a failure on
    # main opens a fix order), not on PRs: measured on a shared runner, they fail now and then on its noise. Run CI by
    # hand on a branch for its numbers. Same scope as desktop.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run from a branch compares with its merge base on main, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        id: scope
        working-directory: .
        run: |
          run=true
          base=$(git rev-parse -q --verify HEAD^1 || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            base=$(git merge-base origin/main HEAD || true)
          fi
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- app/desktop .github/workflows/ci.yml; then
            run=false
            echo "app/desktop didn't change."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Test build (DevTools-driven perf and recording)
        # The release build refuses --remote-debugging-port, which the perf and recording runs drive the app with.
        if: steps.scope.outputs.run == 'true'
        run: pnpm build:test
      - name: Fixtures key
        # A hash of every file `pnpm fixtures` reads; a hit skips the build.
        if: steps.scope.outputs.run == 'true'
        id: fixtures-key
        run: echo "key=$(node scripts/fixtures-key.ts)" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        id: fixtures
        uses: actions/cache@v5
        with:
          path: app/desktop/fixtures/*.json
          key: fixtures-${{ runner.os }}-${{ steps.fixtures-key.outputs.key }}
      - name: Fixtures
        if: steps.scope.outputs.run == 'true' && steps.fixtures.outputs.cache-hit != 'true'
        run: pnpm fixtures
      - name: Budgets (Linux)
        # Measured on this runner, not the budget machine (an M-series Mac: scripts/perf-mac.sh), so this fails on a
        # regression from perf/baseline-linux.json and only reports the budgets. The numbers go to the job summary.
        if: steps.scope.outputs.run == 'true'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" node perf/run.ts --baseline perf/baseline-linux.json --json "$RUNNER_TEMP/perf.json"

  desktop-mac-layout:
    # The mac app packed on Linux, as the edge build packs it on macOS but unsigned and arm64 only (electron-builder
    # signs and merges a universal app only on macOS): Electron's fuses in the mac binary, both darwin keyring modules
    # unpacked beside the asar, and the Info.plist the app's links and updates rest on. Launching it is mac.yml's,
    # nightly. Same scope as desktop.
    name: desktop (mac layout)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run from a branch compares with its merge base on main, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        id: scope
        working-directory: .
        run: |
          run=true
          base=$(git rev-parse -q --verify HEAD^1 || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            base=$(git merge-base origin/main HEAD || true)
          fi
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- app/desktop .github/release/desktop-fuses-check.sh .github/workflows/ci.yml; then
            run=false
            echo "app/desktop didn't change."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      # darwin's native packages too (@napi-rs/keyring's), which a Linux install leaves out.
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --os current --os darwin --cpu x64 --cpu arm64
      - if: steps.scope.outputs.run == 'true'
        run: pnpm build
      - name: Pack and check the mac app
        if: steps.scope.outputs.run == 'true'
        run: |
          pnpm exec electron-builder --mac --dir --arm64 --publish never -c.directories.output=dist-test -c.mac.identity=null
          node scripts/mac-layout-check.ts dist-test/mac-arm64/fleetd.app
          ../../.github/release/desktop-fuses-check.sh dist-test/mac-arm64/fleetd.app
