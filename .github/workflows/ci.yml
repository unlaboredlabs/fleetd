name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Linux jobs run on Blacksmith, except for pull requests from forks, which fall back to GitHub-hosted runners so a
# stranger's PR never spends Blacksmith minutes (forks also need a maintainer's approval to run at all).
# macOS stays on GitHub-hosted macos-latest, which is free for public repos.

jobs:
  rust-crates:
    # The root Cargo workspace minus the GPUI app and its bench, which `rust` below builds on Linux and macOS.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --exclude fleetd-app --exclude fleetd-bench --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude fleetd-app --exclude fleetd-bench
      - name: Claude runner conformance (fixtures)
        # CI has no claude. The streams recorded from claude at version.rs TESTED go through the decoders, the
        # failure classifier and the conformance probe (against a stand-in replaying the recorded initialize
        # answer). Its own step so a claude protocol drift reads as such; re-record the fixtures when bumping TESTED.
        run: cargo test --locked -p fleetd --lib node::runner
      # For the site job. The dependencies are already built by the tests, so this compiles only the binary.
      - run: cargo run --locked -q -p fleetd -- help > "$RUNNER_TEMP/fleetd-help.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: fleetd-help
          path: ${{ runner.temp }}/fleetd-help.txt
          retention-days: 1

  site:
    # fleetd.sh may only mention what fleetd has: no index.* in site/ (Vercel would serve it at / instead of the
    # installer), nothing from site/.stale-terms, and only `fleetd` commands that `fleetd help` lists.
    needs: rust-crates
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: fleetd-help
          path: ${{ runner.temp }}
      - run: node .github/site-check.mjs "$RUNNER_TEMP/fleetd-help.txt"

  rust:
    strategy:
      matrix:
        os: [linux, macos]
    runs-on: ${{ matrix.os == 'macos' && 'macos-latest' || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest') }}
    # gpui is ~600 crates; the first uncached build takes a while.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The seal interop test opens what Rust seals with libsodium (tests/lab's libsodium-wrappers).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/lab/package-lock.json
      - run: npm ci --prefix tests/lab --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: GPUI build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libwayland-dev libvulkan-dev
      - name: Use Command Line Tools only (macOS)
        # Proves the app builds without full Xcode: gpui's runtime_shaders feature skips `xcrun metal`.
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          xcode-select -p
          if xcrun --find metal 2>/dev/null; then echo "metal compiler unexpectedly present"; fi
      - run: cargo clippy --locked -p fleetd-app -p fleetd-bench --all-targets -- -D warnings
      - run: cargo test --locked -p fleetd-app -p fleetd-bench
        env:
          FLEETD_REQUIRE_NODE_SEAL: "1"
      - run: cargo build --locked -p fleetd-app
      - name: App bundle (macOS)
        # Notifications on macOS need the app bundle; this proves the script makes a valid, signed one.
        if: runner.os == 'macOS'
        run: app/packaging/macos-bundle.sh target/debug/fleetd-app && codesign --verify target/debug/fleetd.app

  darwin-deps:
    # The release cross-builds the darwin fleetd binaries on Linux, which breaks on any crate that links a macOS
    # framework. Catch one here, before it lands on main.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - if: hashFiles('crates/fleetd/Cargo.toml') != ''
        run: .github/release/check-darwin-deps.sh
