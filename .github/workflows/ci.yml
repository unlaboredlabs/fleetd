name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Built CLI runs
        # The hub reads the lead prompt from beside the bundle.
        run: node apps/cli/dist/bin.js --version && test -s apps/cli/dist/prompt-v2.md
      - name: Lead prompt ships beside the CLI bundle
        run: test -s apps/cli/dist/prompt-v4.md

  rust-crates:
    # The root Cargo workspace (crates/*); the app under app/ is still its own workspace, built by `rust` below.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  t3-conformance:
    # t3-wire against T3's own contracts at the pin (vendor/t3/pin.json), and the recorded T3 streams through its
    # decoders. Fails on a removed method or a field fleetd sends or reads that T3 renamed, retyped or dropped.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pinned T3 contracts
        # Only packages/contracts at the pin, with the effect version T3's catalog names (its only dependency).
        run: |
          pin=$(jq -r .commit vendor/t3/pin.json)
          t3="$RUNNER_TEMP/t3"
          git init -q "$t3"
          git -C "$t3" remote add origin https://github.com/pingdotgg/t3code
          git -C "$t3" sparse-checkout set packages/contracts
          git -C "$t3" fetch -q --depth 1 --filter=blob:none origin "$pin"
          git -C "$t3" checkout -q FETCH_HEAD
          effect=$(sed -n 's/^  effect: \([0-9][0-9.]*\)$/\1/p' "$t3/pnpm-workspace.yaml" | head -1)
          npm install --prefix "$RUNNER_TEMP/t3-effect" --no-save --no-package-lock --no-audit --no-fund "effect@$effect"
          mkdir -p "$t3/packages/contracts/node_modules"
          ln -s "$RUNNER_TEMP/t3-effect/node_modules/effect" "$t3/packages/contracts/node_modules/effect"
      - run: cargo xtask t3-conformance --t3 "$RUNNER_TEMP/t3"

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # gpui is ~600 crates; the first uncached build takes a while.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # The seal interop test opens what Rust seals with the node's libsodium (apps/node's libsodium-wrappers).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @fleetd/node
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: GPUI build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libwayland-dev libvulkan-dev
      - name: Use Command Line Tools only (macOS)
        # Proves the app builds without full Xcode: gpui's runtime_shaders feature skips `xcrun metal`.
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          xcode-select -p
          if xcrun --find metal 2>/dev/null; then echo "metal compiler unexpectedly present"; fi
      - run: cargo check --locked --all-targets
      - run: cargo test --locked
        env:
          FLEETD_REQUIRE_NODE_SEAL: "1"
      - run: cargo build --locked -p fleetd-app
      - name: App bundle (macOS)
        # Notifications on macOS need the app bundle; this proves the script makes a valid, signed one.
        if: runner.os == 'macOS'
        run: ./macos-bundle.sh target/debug/fleetd-app && codesign --verify target/debug/fleetd.app
