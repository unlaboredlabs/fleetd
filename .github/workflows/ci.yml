name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Everything runs on GitHub-hosted runners, which are free for public repos. Rust caches are saved from main only:
# the repo's 10 GB cache quota holds one copy per job, and pull requests restore main's.

jobs:
  rust-crates:
    # The root Cargo workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Generated contracts are current
        # crates/fleetd-contracts/schema/*.json and the desktop app's TypeScript
        # (app/desktop/src/shared/contracts/generated/) are generated from the Rust contracts. This fails when either
        # differs from a fresh render, a hand edit included. Fix: cargo run -p fleetd-contracts --bin fleetd-schema.
        run: cargo run --locked -q -p fleetd-contracts --bin fleetd-schema -- --check
      - name: Claude runner conformance (fixtures)
        # CI has no claude. The streams recorded from claude at version.rs TESTED go through the decoders, the
        # failure classifier and the conformance probe (against a stand-in replaying the recorded initialize
        # answer). Its own step so a claude protocol drift reads as such; re-record the fixtures when bumping TESTED.
        run: cargo test --locked -p fleetd --lib node::runner
      - name: fleetd.sh/docs is up to date
        # site/docs/ is committed (Vercel has no build step); this fails while it differs from docs/site/*.md and
        # fleetd help. Fix: cargo run -q -p docsgen, then commit site/docs.
        run: cargo run --locked -q -p docsgen -- --check
      # For the site job. The dependencies are already built by the tests, so this compiles only the binary.
      - run: cargo run --locked -q -p fleetd -- help > "$RUNNER_TEMP/fleetd-help.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: fleetd-help
          path: ${{ runner.temp }}/fleetd-help.txt
          retention-days: 1

  site:
    # fleetd.sh may only mention what fleetd has: no index.* at the root of site/ (Vercel would serve it at / instead
    # of the installer), nothing from site/.stale-terms, and only `fleetd` commands that `fleetd help` lists, on the
    # landing page and in the docs' sources; every vercel.json rewrite lands on a file (under cleanUrls) and `/` is the
    # landing page for a browser and install.sh for curl; every link on the site resolves; and no tracked file names a
    # maintainer's own machine, login or home directory.
    needs: rust-crates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: fleetd-help
          path: ${{ runner.temp }}
      - run: node .github/site-check.mjs "$RUNNER_TEMP/fleetd-help.txt"
      - name: No personal identifiers
        run: node .github/personal-check.mjs
      - name: Internal links and anchors
        run: node .github/docs-links.mjs

  site-external-links:
    # Every external link on fleetd.sh and its docs answers (10 s a try, two tries). Links into this repo on GitHub
    # are checked against the checkout by the site job instead.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/docs-links.mjs --external

  rust:
    # What rust-crates can't check on its own: on both OSes, that libsodium (in Node, as the desktop app seals) opens
    # what the node's Rust seals and the other way round; on macOS, the node's power code (IOKit). `rust (linux)` and
    # `rust (macos)` are required checks.
    strategy:
      matrix:
        os: [linux, macos]
    runs-on: ${{ matrix.os == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Scope
        # The macOS leg does the work only when the node's code, the dependency set or this workflow changed;
        # otherwise it reports success at once. HEAD^1 is the base for a PR's merge commit and the previous main for a
        # (squash-merged) push. The rest of crates/fleetd's macOS code is cross-built and checked by darwin-deps and
        # the nightly.
        id: scope
        run: |
          run=true
          if [ "$RUNNER_OS" = macOS ] && git rev-parse -q --verify HEAD^1 >/dev/null &&
            git diff --quiet HEAD^1 HEAD -- crates/fleetd/src/node Cargo.toml Cargo.lock .github/workflows/ci.yml; then
            run=false
            echo "Nothing macOS-relevant changed; the Linux leg covers this."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/lab/package-lock.json
      - if: steps.scope.outputs.run == 'true'
        run: npm ci --prefix tests/lab --no-audit --no-fund
      - if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Sealed boxes against libsodium
        if: steps.scope.outputs.run == 'true'
        run: cargo test --locked -p fleetd --lib node::identity
        env:
          FLEETD_REQUIRE_NODE_SEAL: "1"
      - name: Node power on macOS
        # The sleep assertion and the wake clock, natively: the test takes a real assertion on the runner and
        # releases it.
        if: runner.os == 'macOS' && steps.scope.outputs.run == 'true'
        run: cargo test --locked -p fleetd --lib node::power

  darwin-deps:
    # The release cross-builds the darwin fleetd binaries on Linux, which breaks on any crate that links a macOS
    # framework. Catch one here, before it lands on main.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - if: hashFiles('crates/fleetd/Cargo.toml') != ''
        run: .github/release/check-darwin-deps.sh

  desktop:
    # app/desktop, the Electron app (its own pnpm workspace): typecheck, lint, unit tests and a build. Runs when
    # app/desktop or this workflow changed; otherwise it reports success at once, so it can be a required check.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Scope
        id: scope
        working-directory: .
        run: |
          run=true
          if git rev-parse -q --verify HEAD^1 >/dev/null && git diff --quiet HEAD^1 HEAD -- app/desktop .github/workflows/ci.yml; then
            run=false
            echo "app/desktop didn't change."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.run == 'true'
        run: pnpm typecheck
      - if: steps.scope.outputs.run == 'true'
        run: pnpm lint
      - if: steps.scope.outputs.run == 'true'
        run: pnpm test
      - if: steps.scope.outputs.run == 'true'
        run: pnpm build
      - name: A release build refuses debugging switches
        # Builds both variants, lays each out as a packaged app and launches it: with a DevTools switch the release
        # build must exit before anything listens; the test build must still listen. The fuse-only cases (--inspect)
        # run against the real package in build-release.yml.
        if: steps.scope.outputs.run == 'true'
        run: pnpm debug-guard-check
      - name: Test build (DevTools-driven perf and recording)
        # The release build refuses --remote-debugging-port, which the perf and recording runs drive the app with.
        if: steps.scope.outputs.run == 'true'
        run: pnpm build:test
      - name: Budgets (Linux)
        # Measured on this runner, not the budget machine (an M-series Mac: scripts/perf-mac.sh), so this fails on a
        # regression from perf/baseline-linux.json and only reports the budgets. The numbers go to the job summary.
        if: steps.scope.outputs.run == 'true'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" pnpm perf --baseline perf/baseline-linux.json --json "$RUNNER_TEMP/perf.json"
      - name: Demo recording (Linux)
        # FLEETD_RECORD + FLEETD_DEMO_TYPE end to end: the app records itself typing an order, the clip ends on
        # SIGUSR1, and both MP4s must be H.264 with frames.
        if: steps.scope.outputs.run == 'true'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" pnpm perf:record
