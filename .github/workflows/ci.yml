name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        # Set by macos-label.yml: the PR's dispatched runs share a concurrency group of their own.
        description: The pull request this run is for
        type: string
        default: ""

# A newer push to a PR cancels its running CI. A run macos-label.yml dispatches for it has a group of its own, so it
# never cancels the PR's own run: GitHub's ruleset reads the required checks from that run, and one cancelled by a
# dispatched run on the same head blocked the merge though the dispatched run passed (#510). A newer dispatch replaces
# it, and macos-label.yml cancels it once a push moves the PR on. Runs on main and on the merge train's batch PR
# (<prefix>train/batch) are never cancelled: each gets a group of its own.
concurrency:
  group: >-
    ${{ (github.ref == 'refs/heads/main' || endsWith(github.head_ref || github.ref, 'train/batch'))
    && format('{0}-{1}', github.workflow, github.run_id)
    || github.event_name == 'workflow_dispatch' && inputs.pr && format('{0}-{1}-label', github.workflow, inputs.pr)
    || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !endsWith(github.head_ref || github.ref, 'train/batch') }}

permissions:
  contents: read

# Line tables only, not full debug info: backtraces keep their file and line, and the build, its link and the cache
# each job restores are smaller.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Everything runs on GitHub-hosted runners, which are free for public repos. Rust caches are saved from main only:
# the repo's 10 GB cache quota holds one copy per job, and pull requests restore main's.
#
# macOS runners are few, and GitHub doesn't start queued jobs in order, so the macOS jobs (rust-macos, desktop-macos)
# run only where they decide a merge: on main, on workflow_dispatch, on the merge train's batch PR, and on a PR labelled
# `fleetd:next` (the train puts it on the PR it merges alone, before it rebases it) or `macos` (by hand). Adding either
# label runs this workflow on the PR's branch (macos-label.yml). Elsewhere they are skipped; a skipped job still
# reports, so the required `rust (macos)` does too.

jobs:
  rust-crates:
    # The root Cargo workspace's tests. Lint (fmt, clippy) and the docs and lab checks on the built binary are jobs of
    # their own, beside this one: one job ran all four one after the other.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Also checks that the generated contracts (schema/*.json and the app's TypeScript) are current
      # (schema::generated_contracts_are_current) and replays the recorded claude fixtures (node::runner).
      - run: cargo test --locked --workspace

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Hub migrations only add new files, after the base's
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          node .github/migrations-check.mjs FETCH_HEAD
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust-docs:
    # The docs' generated pages, `fleetd help` for the site job, and the lab scenarios, all on one debug build.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked -p fleetd -p docsgen
      - name: The docs' generated pages are up to date
        # The CLI reference, the Agent tools page and the prompt table in docs/site/src/content/docs come from the
        # code. This fails while they differ from a fresh render. Fix: cargo run -q -p docsgen, then rebuild and commit
        # (site/README.md).
        run: cargo run --locked -q -p docsgen -- --check
      # For the site job.
      - run: target/debug/fleetd help > "$RUNNER_TEMP/fleetd-help.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: fleetd-help
          path: ${{ runner.temp }}/fleetd-help.txt
          retention-days: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/lab/package-lock.json
      - run: npm ci --prefix tests/lab --no-audit --no-fund
      - name: Lab scenarios on a project that isn't fleetd
        # W9's tests/lab/factory, on the debug binary built above: a hub and a node on a generated Python repo with a
        # local ssh-style origin, and an offline stand-in for claude. No network, GitHub or claude login.
        run: npm run factory --prefix tests/lab
        env:
          FLEETD_BIN: ${{ github.workspace }}/target/debug/fleetd
          FLEETD_FACTORY_DIR: ${{ runner.temp }}/factory
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lab-factory-logs
          path: ${{ runner.temp }}/factory/*/logs/
          if-no-files-found: ignore
          retention-days: 14

  site:
    # fleetd.sh may only mention what fleetd has: no index.* at the root of site/ (Vercel would serve it at / instead
    # of the installer), nothing from site/.stale-terms, and only `fleetd` commands that `fleetd help` lists, on the
    # landing page and in the docs' sources; every vercel.json rewrite lands on a file (under cleanUrls) and `/` is the
    # landing page for a browser and install.sh for curl; site/docs is the docs' current build; every link on the site
    # resolves; no tracked file names a maintainer's own machine, login or home directory; and the landing page fits
    # every width.
    needs: rust-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: fleetd.sh/docs is the current build
        # site/docs/ is committed. This fails while it differs from a fresh Starlight build of docs/site. Fix: npm ci
        # --prefix docs/site && npm run build --prefix docs/site, then commit. The search index (site/docs/pagefind) is
        # not committed but ignored: the Vercel build of site/ generates it (site/vercel.json's buildCommand), so docs
        # PRs don't conflict on it.
        run: |
          npm ci --prefix docs/site --no-audit --no-fund
          npm run build --prefix docs/site
          if [ -n "$(git ls-files site/docs/pagefind)" ]; then
            echo "::error::site/docs/pagefind is tracked; the Vercel build generates it: git rm -r --cached site/docs/pagefind"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- site/docs)" ]; then
            git status --short -- site/docs | head -20
            echo "::error::site/docs differs from a fresh build of docs/site; rebuild and commit it (site/README.md, Docs)"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: fleetd-help
          path: ${{ runner.temp }}
      - run: node .github/site-check.mjs "$RUNNER_TEMP/fleetd-help.txt"
      - name: No personal identifiers
        run: node .github/personal-check.mjs
      - name: Internal links and anchors
        run: node .github/docs-links.mjs
      - name: Landing page fits every width
        # Renders site/home.html in the runner's google-chrome at 320 to 1920 px wide and fails when the page scrolls
        # sideways.
        run: node .github/site-layout-check.mjs

  site-external-links:
    # Every external link on fleetd.sh and its docs answers (10 s a try, two tries). Links into this repo on GitHub
    # are checked against the checkout by the site job instead.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/docs-links.mjs --external

  rust:
    # What rust-crates can't check on its own: that libsodium (in Node, as the desktop app seals) opens what the node's
    # Rust seals and the other way round. rust-macos runs the same on macOS. `rust (linux)` and `rust (macos)` are
    # required checks.
    name: rust (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/lab/package-lock.json
      - run: npm ci --prefix tests/lab --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Sealed boxes against libsodium
        run: cargo test --locked -p fleetd --lib node::identity
        env:
          FLEETD_REQUIRE_NODE_SEAL: "1"
      - name: agent-browser's own scripts run in a session that filled a login
        # The pinned agent-browser (agent_browser.rs's VERSION), on the runner's Chrome: every script its commands
        # send is one of the pinned shapes (agent_browser_shapes.json) and a sealed session runs it, and its commands
        # work after a fill. FLEETD_REQUIRE_AGENT_BROWSER makes these tests fail, not skip, without it or a Chrome.
        run: |
          version="$(sed -n 's/^pub const VERSION: &str = "\(.*\)";$/\1/p' crates/fleetd/src/node/browser/agent_browser.rs)"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/agent-browser" "agent-browser@$version"
          # The package carries each platform's binary itself; its install script only links one, so skipping it
          # leaves them all in bin/. Fail here, plainly, if this one isn't there or doesn't run.
          bin="$RUNNER_TEMP/agent-browser/node_modules/agent-browser/bin/agent-browser-linux-x64"
          test -f "$bin" || { ls -l "$(dirname "$bin")"; echo "no $bin in agent-browser@$version" >&2; exit 1; }
          chmod +x "$bin"
          "$bin" --version | grep -F "$version"
          FLEETD_TEST_AGENT_BROWSER="$bin" cargo test --locked -p fleetd --lib agent_browser
        env:
          FLEETD_REQUIRE_AGENT_BROWSER: "1"

  rust-macos:
    # rust (linux)'s sealed boxes on macOS, and the node's power code (IOKit).
    name: rust (macos)
    if: >-
      github.event_name != 'pull_request' || endsWith(github.head_ref, 'train/batch')
      || contains(github.event.pull_request.labels.*.name, 'fleetd:next')
      || contains(github.event.pull_request.labels.*.name, 'macos')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run from a branch compares with its merge base on main, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        # Does the work only when the node's code, the dependency set or this workflow changed; otherwise it reports
        # success at once. HEAD^1 is the base for a PR's merge commit and the previous main for a (squash-merged)
        # push; a manual run from a branch compares with the branch's merge base on main. The rest of crates/fleetd's
        # macOS code is cross-built and checked by darwin-deps and the edge build.
        id: scope
        run: |
          run=true
          base=$(git rev-parse -q --verify HEAD^1 || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            base=$(git merge-base origin/main HEAD || true)
          fi
          if [ -n "$base" ] &&
            git diff --quiet "$base" HEAD -- crates/fleetd/src/node Cargo.toml Cargo.lock .github/workflows/ci.yml; then
            run=false
            echo "Nothing macOS-relevant changed; rust (linux) covers this."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/lab/package-lock.json
      - if: steps.scope.outputs.run == 'true'
        run: npm ci --prefix tests/lab --no-audit --no-fund
      - if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Sealed boxes against libsodium
        if: steps.scope.outputs.run == 'true'
        run: cargo test --locked -p fleetd --lib node::identity
        env:
          FLEETD_REQUIRE_NODE_SEAL: "1"
      - name: Node power on macOS
        # The sleep assertion and the wake clock, natively: the test takes a real assertion on the runner and
        # releases it.
        if: steps.scope.outputs.run == 'true'
        run: cargo test --locked -p fleetd --lib node::power

  ios-sessions:
    # node/device/ios on a real iOS simulator: the probes its design rests on (simctl clone needs its source shut down,
    # boot times, the live view's screenshot loop, recordVideo's MP4; idb's stream where idb is installed, which the
    # runner's Homebrew refuses: facebook/fb is an untrusted tap), then a session end to end
    # with the hub in process. Only where rust-macos runs, and only when node/device or this workflow changed: making
    # the golden simulator (a settling boot and an xcodebuild of agent-device's runner) takes minutes. On main, only the
    # newest push runs it: a push cancels the job in main's older push runs, and Scope compares with the last push run
    # whose job wasn't cancelled (.github/main-base.sh), or runs in full without one, so no change goes untested. The
    # hub ignores cancelled checks when it looks for red on main (hub/train/watch.rs).
    name: ios sessions
    if: >-
      github.event_name != 'pull_request' || endsWith(github.head_ref, 'train/batch')
      || contains(github.event.pull_request.labels.*.name, 'fleetd:next')
      || contains(github.event.pull_request.labels.*.name, 'macos')
    concurrency:
      group: >-
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ios-sessions-main'
        || format('ios-sessions-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run=true
          base=$(git rev-parse -q --verify HEAD^1 || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            base=$(git merge-base origin/main HEAD || true)
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            last=$(.github/main-base.sh ci.yml "ios sessions")
            if [ -n "$last" ] && git fetch -q --depth=1 origin "$last"; then base=$last; else base=; fi
            echo "Comparing with ${base:-nothing: no earlier finished run found, so it runs in full}."
          fi
          if [ -n "$base" ] &&
            git diff --quiet "$base" HEAD -- crates/fleetd/src/node/device .github/workflows/ci.yml; then
            run=false
            echo "node/device didn't change."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The probe first, on a quiet machine; then the rest, the session end to end among them.
      - name: What iOS sessions rest on, measured
        if: steps.scope.outputs.run == 'true'
        run: cargo test --locked -p fleetd --lib node::device::ios::tests::probes -- --nocapture
      - name: iOS sessions on a simulator
        if: steps.scope.outputs.run == 'true'
        run: cargo test --locked -p fleetd --lib node::device::ios -- --nocapture --test-threads=1 --skip probes
        env:
          FLEETD_TEST_IOS_HOME: ${{ runner.temp }}/fleetd-test-ios

  darwin-deps:
    # The release cross-builds the darwin fleetd binaries on Linux, which breaks on any crate that links a macOS
    # framework. Catch one here, before it lands on main.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - if: hashFiles('crates/fleetd/Cargo.toml') != ''
        run: .github/release/check-darwin-deps.sh

  desktop:
    # app/desktop, the Electron app (its own pnpm workspace): typecheck, lint, unit tests and a build. Runs when
    # app/desktop or this workflow changed; otherwise it reports success at once, so it can be a required check.
    # desktop-packaged runs the packed app and its budgets beside it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run from a branch compares with its merge base on main, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        id: scope
        working-directory: .
        run: |
          run=true
          base=$(git rev-parse -q --verify HEAD^1 || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            base=$(git merge-base origin/main HEAD || true)
          fi
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- app/desktop .github/workflows/ci.yml; then
            run=false
            echo "app/desktop didn't change."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - if: steps.scope.outputs.run == 'true'
        name: No paths that differ only in case
        # macOS checkouts are case-insensitive: Composer.tsx beside composer.ts breaks the Mac build and the
        # "./composer" import alike, so the extension is ignored too.
        run: |
          clashes=$(git ls-files | sed -E 's/\.[^./]+$//' | awk '{ l = tolower($0) } (l in seen) && seen[l] != $0 { print seen[l] " / " $0; next } { seen[l] = $0 }')
          if [ -n "$clashes" ]; then echo "Paths that differ only in case (rename one):"; echo "$clashes"; exit 1; fi
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.run == 'true'
        run: pnpm typecheck
      - if: steps.scope.outputs.run == 'true'
        run: pnpm lint
      - if: steps.scope.outputs.run == 'true'
        run: pnpm test
      - if: steps.scope.outputs.run == 'true'
        run: pnpm build
      - name: A release build refuses debugging switches
        # Builds both variants, lays each out as a packaged app and launches it: with a DevTools switch the release
        # build must exit before anything listens; the test build must still listen. The fuse-only cases (--inspect)
        # run against the real package in build-release.yml.
        if: steps.scope.outputs.run == 'true'
        run: pnpm debug-guard-check

  desktop-packaged:
    # The test build of app/desktop, packed and run: the edge build's smoke, the recordings and the Linux budgets. Same
    # scope as desktop.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run from a branch compares with its merge base on main, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        id: scope
        working-directory: .
        run: |
          run=true
          base=$(git rev-parse -q --verify HEAD^1 || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            base=$(git merge-base origin/main HEAD || true)
          fi
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- app/desktop .github/workflows/ci.yml; then
            run=false
            echo "app/desktop didn't change."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Test build (DevTools-driven perf and recording)
        # The release build refuses --remote-debugging-port, which the perf and recording runs drive the app with.
        if: steps.scope.outputs.run == 'true'
        run: pnpm build:test
      - name: Fixtures
        # Built once for the steps below: `pnpm perf` and `pnpm perf:record` would each build them again (a minute).
        if: steps.scope.outputs.run == 'true'
        run: pnpm fixtures
      - name: Packaged smoke (Linux)
        # The edge build's smoke (build-release.yml) on that test build, packed as the edge build packs it: otherwise a
        # PR that renames or removes a screen breaks only the edge build. Headless, so no virtual display.
        if: steps.scope.outputs.run == 'true'
        run: |
          pnpm exec electron-builder --linux --dir --publish never -c.directories.output=dist-test
          node scripts/packaged-smoke.ts dist-test/linux-unpacked/fleetd-desktop --no-sandbox --ozone-platform=headless
      - name: Packaged recording (Linux)
        # FLEETD_RECORD in the packed app, which loads the recorder page from the asar; Demo recording below runs out/.
        if: steps.scope.outputs.run == 'true'
        run: node scripts/packaged-smoke.ts --record dist-test/linux-unpacked/fleetd-desktop --no-sandbox --ozone-platform=headless
      - if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packaged-smoke-linux
          path: app/desktop/smoke-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Budgets (Linux)
        # Measured on this runner, not the budget machine (an M-series Mac: scripts/perf-mac.sh), so this fails on a
        # regression from perf/baseline-linux.json and only reports the budgets. The numbers go to the job summary.
        if: steps.scope.outputs.run == 'true'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" node perf/run.ts --baseline perf/baseline-linux.json --json "$RUNNER_TEMP/perf.json"
      - name: Demo recording (Linux)
        # FLEETD_RECORD + FLEETD_DEMO_TYPE end to end: the app records itself typing an order, the clip ends on
        # SIGUSR1, and both MP4s must be H.264 with frames.
        if: steps.scope.outputs.run == 'true'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" node perf/record-smoke.ts

  desktop-macos:
    # The edge build's macOS packaged smoke (build-release.yml, desktop-macos) on an ad-hoc signed arm64 test build, so
    # a change that breaks the packed mac app fails here rather than only in the edge build. Same scope as desktop, and
    # skipped where rust-macos is.
    if: >-
      github.event_name != 'pull_request' || endsWith(github.head_ref, 'train/batch')
      || contains(github.event.pull_request.labels.*.name, 'fleetd:next')
      || contains(github.event.pull_request.labels.*.name, 'macos')
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run from a branch compares with its merge base on main, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Scope
        id: scope
        working-directory: .
        run: |
          run=true
          base=$(git rev-parse -q --verify HEAD^1 || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            base=$(git merge-base origin/main HEAD || true)
          fi
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- app/desktop .github/workflows/ci.yml; then
            run=false
            echo "app/desktop didn't change."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/desktop/package.json
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Packaged smoke (macOS)
        if: steps.scope.outputs.run == 'true'
        run: |
          pnpm fixtures
          pnpm build:test
          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac --dir --arm64 --publish never -c.directories.output=dist-test \
            -c.mac.identity=- -c.mac.hardenedRuntime=false
          node scripts/packaged-smoke.ts dist-test/mac-arm64/fleetd.app/Contents/MacOS/fleetd
      - name: Packaged recording (macOS)
        # FLEETD_RECORD in the packed app (scripts/demo-mac.sh records the edge build this way): the recorder page loads
        # from the asar, which the unpackaged Demo recording run can't catch.
        if: steps.scope.outputs.run == 'true'
        run: node scripts/packaged-smoke.ts --record dist-test/mac-arm64/fleetd.app/Contents/MacOS/fleetd
      - if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packaged-smoke-macos
          path: app/desktop/smoke-results/
          if-no-files-found: ignore
          retention-days: 14
