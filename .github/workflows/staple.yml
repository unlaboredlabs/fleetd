# Staples a published app (the GPUI app and the Electron app, when the release has it) once Apple accepts its
# notarization, when the release job shipped it signed but unstapled because Apple's queue outlasted its wait. No
# rebuild: see .github/release/macos-staple.sh. Every 30 minutes it checks the nightly; that's a no-op once the app
# is stapled, while nothing accepted covers it yet, and on forks.
name: Staple release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        type: string
        default: nightly
      submission:
        description: Notarization submission id (default the newest accepted one whose ticket matches each app)
        type: string
        default: ""
  schedule:
    - cron: "7,37 * * * *"

# Not the release's own group: a queued run there would cancel a pending nightly. The script instead skips while a
# release build runs and re-checks the asset just before replacing it.
concurrency:
  group: staple-${{ inputs.tag || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: write
  # To see whether a nightly is building.
  actions: read

jobs:
  staple:
    if: github.repository == 'unlaboredlabs/fleetd'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Staple and replace the app zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'nightly' }}
          SUBMISSION: ${{ inputs.submission }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: .github/release/macos-staple.sh
