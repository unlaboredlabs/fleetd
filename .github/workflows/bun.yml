# The Bun/TypeScript fleetd experiment (experimental/bun, D342/D343): its generated files, its type check with tsc-rs,
# its tests, and the `bun build --compile` binary, run end to end; then the binary against the Rust one's black-box
# tests (experimental/compare's cargo:session_host, the lab's self-healing scenario on a Rust hub). Only when the
# experiment changes; not a required check, and nothing else in CI reads it. Pull requests only, so a red run never
# counts as main's.
name: Bun experiment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - experimental/bun/**
      - .github/workflows/bun.yml
  workflow_dispatch:

concurrency:
  group: bun-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bun:
    name: bun (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # As ci.yml's, so the Rust cache restored below is the `rust` job's and its builds match.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # The Rust session-host helper beside the Bun binary, where the Bun node looks for it (#1269; `bun run helper`).
      NATIVE_HELPER: fleetd-session-host
    defaults:
      run:
        working-directory: experimental/bun
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # tsc-rs comes from npm, pinned in bun.lock (its native binary is the @tsc-rs/<platform> package).
      - run: bun install --frozen-lockfile
      - name: Generated files are current (tools, migrations, wire tags, PORT_MAP.md)
        run: bun run gen:check
      - name: Type check (tsc-rs)
        run: bun run typecheck
      - run: bun test
      - run: bun run compile
      - name: The binary end to end
        run: bun run smoke
      - name: Binary size
        run: ls -l dist/fleetd
      # The Bun node hosts sessions under the Rust binary's `fleetd session-host` (D343: native pieces stay Rust).
      # The `rust` job's cache (ci.yml), restored only: its dependencies are built for these tests already.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          save-if: false
      - name: The Rust fleetd and its session_host test
        working-directory: ${{ github.workspace }}
        run: |
          cargo test --locked -p fleetd --test session_host --no-run
          cp target/debug/fleetd "experimental/bun/dist/$NATIVE_HELPER"
      # TODO(T2248): both steps below fail on main until T2248's fixes land (the Bun node finding the Rust session-host
      # helper beside it, restore_worktree after a crash). Once they have, drop their continue-on-error so a red one
      # fails the job. This job stays a non-required check either way.
      - name: cargo:session_host on the Bun binary (non-blocking until T2248)
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: cargo test --locked -q -p fleetd --test session_host
        env:
          FLEETD_BIN: ${{ github.workspace }}/experimental/bun/dist/fleetd
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/lab/package-lock.json
      - run: npm ci --prefix tests/lab --no-audit --no-fund
        working-directory: ${{ github.workspace }}
      - name: Self-healing lab scenario, a Rust hub with the Bun node (non-blocking until T2248)
        id: self-healing
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        # A Bun-only machine: the node, the CLI and the agents' `fleetd` are the Bun binary; only the hub is Rust.
        run: node tests/lab/factory/run.ts self-healing
        env:
          FLEETD_BIN: ${{ github.workspace }}/experimental/bun/dist/fleetd
          FLEETD_HUB_BIN: ${{ github.workspace }}/target/debug/fleetd
          FLEETD_FACTORY_DIR: ${{ runner.temp }}/factory
      - if: steps.self-healing.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: bun-self-healing-logs
          path: ${{ runner.temp }}/factory/*/logs/
          if-no-files-found: ignore
          retention-days: 14
