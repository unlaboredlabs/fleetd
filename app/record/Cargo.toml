[package]
name = "fleetd-record"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "fleetd-app's own-window recorder on macOS (FLEETD_RECORD)"

# No `[lints] workspace = true`: the workspace forbids unsafe code, and this crate is only FFI (CoreGraphics,
# ImageIO, CoreVideo, AVFoundation). Everything here is already in fleetd-app's graph through gpui_macos.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
libc = "0.2"
raw-window-handle = "0.6"
