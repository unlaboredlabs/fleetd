<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The tab's icon, drawn for 16 and 32 px: Pebble whole on its tile, 2 units a pixel at 16 px, its body and eyes on
       whole pixel columns, no filters or clips. The app icon (mac-small.svg) crops Pebble at its tile's bottom edge,
       which at tab size reads as a cut-off picture. The favicon of the web app, fleetd.sh and the docs: npm run icons
       (app/mobile/scripts/icons.ts) writes it, and the web app's favicon.ico of it. -->
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop offset="0" stop-color="#f7f3ec"/><stop offset="1" stop-color="#e3dbd0"/></linearGradient>
    <linearGradient id="body" x2="0" y2="1"><stop offset="0" stop-color="#576d8e"/><stop offset="1" stop-color="#3f587c"/></linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#wall)"/>
  <path transform="translate(-1.24 -1.59) scale(.345)" fill="url(#body)" d="M50 22C66.2 22 79.6 33.2 83.2 50.6C85.9 63.6 84.2 75.6 72.4 81.4C66.2 84.4 58.6 85 50 85C41.4 85 33.8 84.4 27.6 81.4C15.8 75.6 14.1 63.6 16.8 50.6C20.4 33.2 33.8 22 50 22Z"/>
  <g fill="#f9fcff">
    <ellipse cx="12" cy="18.6" rx="2.1" ry="4.2"/>
    <ellipse cx="20" cy="18.6" rx="2.1" ry="4.2"/>
  </g>
</svg>
