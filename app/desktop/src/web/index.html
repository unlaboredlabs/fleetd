<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- fleetd cloud serves this page with its own Content-Security-Policy header, the only policy it has: a meta one
         here would hold for a stand-in on http too, and could only narrow the cloud's. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>fleetd</title>
    <!-- What a shared link to the app shows: the site's own card (site/card.jpg) and words. -->
    <meta name="description" content="Sign in to fleetd: one lead agent for your whole team, on your own machines or fleetd's computers." />
    <meta property="og:title" content="fleetd" />
    <meta property="og:description" content="Sign in to fleetd: one lead agent for your whole team, on your own machines or fleetd's computers." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="fleetd" />
    <meta property="og:image" content="https://fleetd.sh/card.jpg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- fleetd's mark drawn for a tab (app/icon/tab.svg, not the app icon, which reads as cut off at 16 px), the .ico
         of it for what asks /favicon.ico itself; all in public/, at the origin's root, written by npm run icons. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Who is signed in, asked as the page starts rather than once its script has loaded and run: main.tsx's first
         read (session.ts) takes this answer. -->
    <link rel="preload" href="/web/session" as="fetch" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
