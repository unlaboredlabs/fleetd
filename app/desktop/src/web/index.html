<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- fleetd cloud serves this page with its own Content-Security-Policy header, the only policy it has: a meta one
         here would hold for a stand-in on http too, and could only narrow the cloud's. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>fleetd</title>
    <!-- fleetd's mark (site/icon.svg), the .ico for what asks /favicon.ico itself; all in public/, at the origin's root. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Who is signed in, asked as the page starts rather than once its script has loaded and run: main.tsx's first
         read (session.ts) takes this answer. -->
    <link rel="preload" href="/web/session" as="fetch" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
