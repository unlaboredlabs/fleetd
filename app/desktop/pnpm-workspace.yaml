packages:
  - .
# esbuild works from its platform package; its postinstall only re-checks that binary. electron-winstaller is
# electron-builder's Windows piece, unused. tsc-rs's postinstall only swaps its Node launcher for a sh one (saves ~20 ms).
allowBuilds:
  esbuild: false
  electron-winstaller: false
  tsc-rs: false
# Both architectures' native packages (@napi-rs/keyring's), so each half of the universal Mac app gets its own.
supportedArchitectures:
  os: [current]
  cpu: [x64, arm64]
