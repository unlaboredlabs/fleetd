<!doctype html><html><head><style>
*{box-sizing:border-box;margin:0}
body{width:412px;height:915px;overflow:hidden;font:15px Roboto,"Noto Sans",system-ui,sans-serif;background:#fdfbff;color:#1b1b1f}
.sb{height:28px;display:flex;align-items:center;padding:0 18px;font-size:13px;color:#333}.sb span{margin-left:auto}
.ab{height:64px;display:flex;align-items:center;padding:0 18px;font-size:22px;gap:20px}
.chips{display:flex;gap:8px;padding:4px 16px 12px}.chips i{font-style:normal;border:1px solid #c5c6d0;border-radius:8px;padding:6px 12px;font-size:13px}.chips i.on{background:#dce1ff;border-color:#dce1ff}
.card{margin:8px 16px;padding:16px;border-radius:14px;background:#f2f0f7}
.card .n{font-size:13px;color:#5d5e67}.card .a{font-size:24px;margin:4px 0}.card .s{font-size:13px;color:#2e6b30}.card .s.w{color:#8a5a00}
.fab{position:absolute;right:18px;bottom:96px;width:58px;height:58px;border-radius:16px;background:#dce1ff;display:grid;place-items:center;font-size:28px}
.nb{position:absolute;bottom:0;left:0;right:0;height:80px;background:#f0edf4;display:flex;justify-content:space-around;align-items:center;font-size:12px;color:#444}
.nb b{display:block;width:64px;height:30px;border-radius:15px;background:#dce1ff;margin:0 auto 4px}
</style></head><body>
<div class="sb">9:04<span>▾ ▴ 87%</span></div>
<div class="ab">☰ <span>Invoices</span></div>
<div class="chips"><i class="on">October</i><i>September</i><i>Unpaid</i></div>
<div class="card"><div class="n">INV-2026-1041 · Northwind</div><div class="a">€1,840.00</div><div class="s">Paid 2 Nov</div></div>
<div class="card"><div class="n">INV-2026-1042 · Lumen Labs</div><div class="a">€312.50</div><div class="s">Paid 1 Nov</div></div>
<div class="card"><div class="n">INV-2026-1043 · Harbor &amp; Co</div><div class="a">€46.00</div><div class="s w">Due in 14 days</div></div>
<div class="card"><div class="n">INV-2026-1040 · Acme</div><div class="a">€980.00</div><div class="s">Paid 29 Oct</div></div>
<div class="fab">＋</div>
<div class="nb"><div><b></b>Invoices</div><div>Clients</div><div>Settings</div></div>
</body></html>
