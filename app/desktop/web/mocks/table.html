<!doctype html><html><head><style>
*{box-sizing:border-box;margin:0}
body{width:960px;height:600px;overflow:hidden;font:14px Georgia,serif;background:#faf7f2;color:#2a2622}
nav{display:flex;align-items:center;padding:18px 36px;border-bottom:1px solid #e8e1d6}
nav b{font:600 20px Georgia,serif;letter-spacing:.02em}nav span{margin-left:28px;font:13px system-ui,sans-serif;color:#6a6258}
main{display:flex;gap:36px;padding:30px 36px}

.f{width:340px;background:#fff;border:1px solid #e8e1d6;border-radius:8px;padding:22px;font-family:system-ui,sans-serif}
