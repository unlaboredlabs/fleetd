[package]
name = "fleetd-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# gpui pin: zed tag v1.24.2 = fb69067729cb16a7f6135e2c1600c26a28c59659, the latest stable Zed release on
# 2026-10-17. A stable tag is the gpui Zed actually shipped on Linux and macOS, so its platform layers are
# known-good; zed main moves daily and breaks gpui's API without notice. Bump deliberately and re-run
# app/bench/run.sh.
#
# Licenses: only Apache-2.0 crates come from zed (gpui, gpui_platform and, transitively, gpui_linux,
# gpui_macos, gpui_apple, gpui_wgpu, gpui_util, gpui_macros, gpui_shared_string, collections, sum_tree,
# scheduler, refineable, http_client). No GPL/AGPL zed crate (ui, editor, theme, workspace, ...) is used.
#
# `profiler` is on because Zed ships with it; the bench reads present timestamps from it.
[features]
# Compiles Metal shaders at launch, so macOS builds need only the Command Line Tools (no full Xcode /
# `xcrun metal`). Build with --no-default-features on a Mac with Xcode for precompiled shaders.
default = ["runtime-shaders"]
runtime-shaders = ["gpui_platform/runtime_shaders"]

[lints]
workspace = true

[dependencies]
# The hub's wire types: the same crate the hub is built from.
fleetd-contracts.workspace = true
gpui = { git = "https://github.com/zed-industries/zed", rev = "fb69067729cb16a7f6135e2c1600c26a28c59659", default-features = false, features = ["font-kit", "wayland", "x11", "profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fb69067729cb16a7f6135e2c1600c26a28c59659", features = ["font-kit", "wayland", "x11"] }
raw-window-handle = "0.6"
# Hub client. smol's async-net and futures are already in gpui's dependency graph; async-tungstenite adds
# only tungstenite.
async-net = "2"
async-io = "2"
async-tungstenite = { version = "0.35", default-features = false, features = ["handshake", "futures-03-sink"] }
futures = "0.3"
# TLS for https:// and wss:// hubs: rustls on ring (no OpenSSL, no C toolchain beyond cc), certificates checked
# by the OS verifier (Security.framework on macOS, the system roots on Linux).
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
# Sealed secrets: libsodium's crypto_box_seal (X25519 + XSalsa20-Poly1305), which the node opens with
# libsodium-wrappers. Pure Rust (RustCrypto); zeroize wipes the plaintext buffer.
crypto_box.workspace = true
zeroize.workspace = true
base64.workspace = true
# OS keychain: macOS Keychain, Windows Credential Manager, Secret Service (zbus, already in the graph) on Linux.
keyring = "4.2"
# Grapheme boundaries for caret movement and deletion in text fields (emoji, combining marks).
unicode-segmentation = "1"

[dev-dependencies]
# Headless window and simulated keystrokes/clicks for the text field tests.
gpui = { git = "https://github.com/zed-industries/zed", rev = "fb69067729cb16a7f6135e2c1600c26a28c59659", default-features = false, features = ["font-kit", "wayland", "x11", "profiler", "test-support"] }
