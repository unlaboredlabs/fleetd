[package]
name = "fleetd-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Speed baseline driver for fleetd-app (run via app/bench/run.sh)"

[[bin]]
name = "fleetd-bench"
path = "src/main.rs"

# Both crates are already in fleetd-app's dependency graph (via gpui_linux), so they add no new code
# to audit; `xtest` is the only extra feature.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "0.13.1", features = ["xtest"] }
