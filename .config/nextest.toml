# cargo-nextest runs each test in a process of its own: under one `cargo test` process, background work earlier tests
# leave running slows every later one (the hub::train tests took 0.3 s each alone and 2.7 s in the full suite).
# CI runs `cargo nextest run --profile ci` in two shards (`--partition hash:1/2`, `2/2`), which `rust (linux)` gathers;
# doctests run with `cargo test --doc` in the second.

[profile.ci]
# Every failure in one run, not just the first.
fail-fast = false
# A hung test is named after a minute and fails after five, rather than holding the job until its timeout.
slow-timeout = { period = "60s", terminate-after = 5 }
# The summary lists every test that failed and every test that passed only on a retry (FLAKY).
final-status-level = "flaky"
failure-output = "immediate-final"

# The tests that drive a real Chrome (the browser tests, agent-browser among them, and the relay's) fail now and then on
# a busy runner: two more tries, and a pass on a retry is reported as flaky, not hidden.
[[profile.ci.overrides]]
filter = 'package(fleetd) & (test(/^node::browser::/) | test(/^node::relay_tests::/))'
retries = 2

# Temporary, until the session host's race is fixed: run alongside `stop_all_ends_the_sessions_a_node_left_running`,
# `a_hosted_session_outlives_its_node_and_each_event_arrives_once` now and then gets m1..m3 again instead of m4..m6
# (7 of 75 runs together, 0 of 40 alone, on main at 8221b057b). The fix of that race removes this group.
[test-groups]
session-host = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(fleetd) & binary(session_host)'
test-group = 'session-host'
