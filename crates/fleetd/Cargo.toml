[package]
name = "fleetd"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "fleetd: hub, node and CLI in one binary"

[[bin]]
name = "fleetd"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
fleetd-contracts = { path = "../fleetd-contracts" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# store
rusqlite = { workspace = true }
# node
base64 = { workspace = true }
chrono = { workspace = true }
crypto_box = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
nix = { version = "0.30", features = ["fs", "process", "signal"] }
rand = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
# cli
clap = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
# hub framework
axum = { workspace = true }

# attention, wakes
chrono-tz = { workspace = true, features = ["case-insensitive"] }
regex = { workspace = true }
# webhooks
url = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
# tasks, slots, leases
serde_yaml_ng = { workspace = true }
unicode-normalization = { workspace = true }

# hub: leads, intake, playbooks
serde_path_to_error = { workspace = true }
sha1 = { workspace = true }
cliclack = "0.5"
console = "0.16"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
