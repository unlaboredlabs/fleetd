[package]
name = "fleetd"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "fleetd: hub, node and CLI in one binary"

[[bin]]
name = "fleetd"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
fleetd-contracts = { path = "../fleetd-contracts" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
