[package]
name = "fleetd"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "fleetd: hub, node and CLI in one binary"

[[bin]]
name = "fleetd"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
fleetd-contracts = { path = "../fleetd-contracts" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# store
rusqlite = { workspace = true }
# node
base64 = { workspace = true }
chrono = { workspace = true }
crypto_box = { workspace = true }
crypto_secretbox = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
nix = { version = "0.30", features = ["fs", "poll", "process", "signal", "term", "time", "user"] }
rand = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
# browser sessions: the shapes of the scripts a sealed session lets through
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_ast_visit = "0.155"
oxc_codegen = { version = "0.155", default-features = false }
oxc_parser = "0.155"
oxc_span = "0.155"
# cli
clap = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
# hub framework
axum = { workspace = true }

# attention, wakes
chrono-tz = { workspace = true, features = ["case-insensitive"] }
regex = { workspace = true }
url = { workspace = true }
# tasks, slots, the policy file
serde_yaml_ng = { workspace = true }
unicode-normalization = { workspace = true }

# hub: leads, intake, playbooks
serde_path_to_error = { workspace = true }
sha1 = { workspace = true }
cliclack = "0.5"
console = "0.16"
# prompts: the 3-way merge when a release changes a default you edited
diffy = "0.5.2"
# prompts edit: a private scratch file (0600, random name, created exclusively)
tempfile = "3"
# desktop sessions: the node reads the screen (GetImage, DAMAGE) and types and clicks (XTEST) over its own X11
# connection, and encodes the frames as JPEG
x11rb = { version = "=0.14.0", default-features = false, features = ["xtest", "damage"] }
jpeg-encoder = "=0.7.1"

# node power: macOS sleep assertions through IOKit, loaded at run time (the darwin build links no framework)
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# node power: logind's sleep inhibitor and IdleAction over the system bus (pure Rust)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
