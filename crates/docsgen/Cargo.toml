[package]
name = "docsgen"
description = "Generates fleetd.sh/docs (site/docs/) from docs/site/*.md and the binary's own help"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The CLI reference comes from the same usage text `fleetd help` prints, so it can't drift from the binary.
fleetd = { path = "../fleetd" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json.workspace = true

[lints]
workspace = true
