[package]
name = "docsgen"
description = "Writes the generated parts of fleetd.sh/docs (the CLI reference, the prompt table) from the binary itself"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The CLI reference comes from the same usage text `fleetd help` prints, so it can't drift from the binary.
fleetd = { path = "../fleetd" }
fleetd-contracts = { path = "../fleetd-contracts" }
serde_json.workspace = true

[lints]
workspace = true
