# The product workspace: the hub, node and CLI (crates/fleetd), its contracts and the docs generator.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
schemars = "1"
regex = "1"
url = "2"

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
# webpki roots, not native certs: the macOS framework deps native-certs pulls in break the darwin cross-build.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
chrono-tz = "0.10"
crypto_box = { version = "0.9", features = ["seal"] }
crypto_secretbox = "0.1"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = "1"
serde_yaml_ng = "0.10"
unicode-normalization = "0.1"
sha1 = "0.10"
serde_path_to_error = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
