# The product workspace: the crates, the GPUI app and its bench.
[workspace]
resolver = "3"
members = ["crates/*", "app/fleetd-app", "app/bench"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
fleetd-contracts = { path = "crates/fleetd-contracts" }
t3-wire = { path = "crates/t3-wire" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
schemars = "1"
regex = "1"
url = "2"

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
# webpki roots, not native certs: the macOS framework deps native-certs pulls in break the darwin cross-build.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled-full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
croner = "2"
crypto_box = { version = "0.9", features = ["seal"] }
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = "1"
serde_yaml_ng = "0.10"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

# Same shape as Zed's own release profile, so the app's bench numbers compare with what Zed ships.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# gpui comes from zed's workspace, whose [patch] does not apply to a git dependency. Mirror the
# patches gpui itself relies on (zed's Cargo.toml at the pinned rev in app/fleetd-app/Cargo.toml).
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
